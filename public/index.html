<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fx-build" content="2026-11-16-auto-deploy-test">
<title>팩토리얼 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  /* layout: 480px 모바일 단일 컬럼. 흰 종이 위 먹색 글씨, 대표색 파랑(#2d7ce3) 하나. 떠 있는 요소만 유리 재질 */
  --bg:#edf2f9;
  --card:#ffffff;
  --ink:#1a1f2e;
  --muted:#647089;
  --line:#dfe6f0;
  --soft:#e8eef7;
  --red:#2d7ce3;
  --err:#d2342b;
  --frame:#d5deeb;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
@media (min-width:520px){body{background:var(--frame)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:112px}
@media (min-width:520px){.shell{box-shadow:0 0 0 1px var(--line)}}

/* liquid glass: 떠 있는 요소 전용 */
.glass{
  position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.22));
  -webkit-backdrop-filter:blur(16px) saturate(210%) brightness(1.06);
  backdrop-filter:blur(16px) saturate(210%) brightness(1.06);
  border:0;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.95),
    inset 0 -1px 2px rgba(255,255,255,.45),
    inset 0 0 12px rgba(255,255,255,.25),
    0 14px 34px rgba(26,31,46,.16),
    0 2px 6px rgba(26,31,46,.08);
}
/* 위쪽 반사광 */
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.08) 38%,rgba(255,255,255,0) 60%);
}
/* 가장자리 굴절 테두리 */
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,1),rgba(255,255,255,.15) 35%,rgba(255,255,255,.05) 60%,rgba(255,255,255,.75));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
.glass > *:not(.lens){position:relative;z-index:1}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:rgba(255,255,255,.96)}
}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;border-radius:0;box-shadow:inset 0 -1px 0 rgba(26,31,46,.06),0 6px 20px rgba(26,31,46,.06)}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-weight:700;font-size:17px;letter-spacing:-.02em}
.mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:var(--ink);color:#fff;font-family:var(--serif);font-weight:800;font-size:14px}
.mark b{color:#8fbaf3}
.icon-btn{position:relative;width:42px;height:42px;display:grid;place-items:center;background:none;border:0;border-radius:21px}
.badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.badge[hidden]{display:none}

/* home */
.search{margin:14px 16px 0;position:relative}
.search input{width:100%;height:46px;padding:0 14px 0 42px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:15px}
.search svg{position:absolute;left:14px;top:14px;color:var(--muted)}
.label{padding:20px 16px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:16px 16px 0}
.subj{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;min-height:58px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);text-align:left}
.subj .n{font-weight:600;font-size:14.5px;line-height:1.3;word-break:keep-all}
.subj .k{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.subj[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.subj[aria-pressed="true"] .k{color:#b7bccb}
.list-head{display:flex;align-items:baseline;gap:6px;padding:22px 16px 8px}
.list-head h2{font-size:17px;font-weight:700}
.list-head span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.list{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:58px 1fr 16px;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:active{background:var(--soft)}
.info{min-width:0;display:flex;flex-direction:column;gap:2px}
.title{font-weight:600;font-size:16px;line-height:1.35}
.new{font-size:11px;font-weight:600;color:var(--red);margin-left:4px;vertical-align:2px}
.sub{font-size:13px;color:var(--muted)}
.prices{font-size:14px;font-variant-numeric:tabular-nums;margin-top:3px}
.prices .f{color:var(--muted)}
.prices b{font-weight:700}
.chev{color:#b0b3be}
.empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:14px}
.custom-link{display:flex;align-items:center;justify-content:space-between;gap:12px;width:calc(100% - 32px);margin:16px 16px 0;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);text-align:left}
.custom-link b{display:block;font-size:15px}
.custom-link span{font-size:13px;color:var(--muted)}

/* thumbnail */
.thumb{position:relative;width:58px;aspect-ratio:257/364;background:#fff;border:1px solid #cfd0d6;padding:5px 4px;font-family:var(--serif);overflow:hidden}
.thumb .t1{font-size:4.5px;color:var(--muted);text-align:center}
.thumb .t2{font-size:8px;font-weight:800;text-align:center;line-height:1.2;margin-top:2px;border-bottom:1px solid var(--ink);padding-bottom:3px;word-break:keep-all}
.thumb .lines{position:absolute;left:4px;right:4px;top:28px;bottom:5px;background:repeating-linear-gradient(to bottom,#dcdde2 0 1.5px,transparent 1.5px 5.5px);-webkit-mask:linear-gradient(90deg,#000 45%,transparent 45% 55%,#000 55%);mask:linear-gradient(90deg,#000 45%,transparent 45% 55%,#000 55%)}
.thumb .rnd{position:absolute;right:3px;bottom:4px;min-width:20px;height:20px;padding:0 3px;background:#fff;border:1px solid var(--ink);color:var(--ink);font-family:var(--sans);font-size:10px;font-weight:700;display:grid;place-items:center}
.thumb.premium{background:var(--ink);border-color:var(--ink)}
.thumb.premium .t1{color:#9aa0b2}
.thumb.premium .t2{color:#fff;border-color:#fff}
.thumb.premium .lines{background:repeating-linear-gradient(to bottom,#3a4157 0 1.5px,transparent 1.5px 5.5px)}
.thumb.premium .rnd{background:var(--ink);border-color:#fff;color:#fff}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{height:36px;padding:0 14px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* detail */
.backlink{display:flex;align-items:center;gap:4px;background:none;border:0;padding:12px 12px 4px;font-size:14px;color:var(--muted)}
.preview-wrap{padding:10px 16px 18px}
.sheet{position:relative;width:100%;aspect-ratio:257/364;background:#fff;border:1px solid #cfd0d6;padding:5% 5.5%;font-family:var(--serif);overflow:hidden;font-size:clamp(9px,2.7vw,12.5px);line-height:1.6}
.sh-top{display:flex;justify-content:space-between;font-size:.85em;color:var(--muted)}
.sh-title{text-align:center;font-weight:800;font-size:2em;letter-spacing:.15em;margin:.3em 0 .2em;word-break:keep-all}
.sh-row{display:flex;justify-content:space-between;gap:8px;font-size:.82em;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:.35em 0}
.sh-body{display:grid;grid-template-columns:1fr 1fr;gap:6%;margin-top:1em;position:relative}
.sh-body::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #c9cad1}
.q{margin-bottom:1.2em}
.q p{margin:0 0 .5em;font-weight:700}
.q .pts{font-weight:400;color:var(--muted)}
.box{border:1px solid #9a9eab;padding:.5em;margin-bottom:.5em}
.ln{height:.42em;margin:.42em 0;background:#e3e4e9;border-radius:2px}
.opt{display:flex;gap:.4em;align-items:center;margin:.25em 0}
.opt .ln{flex:1;margin:0}
.veil{position:absolute;left:0;right:0;bottom:0;height:58%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9%;background:linear-gradient(to bottom,rgba(255,255,255,0) 0%,rgba(255,255,255,.93) 30%,#fff 60%);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);-webkit-mask:linear-gradient(to bottom,transparent,#000 22%);mask:linear-gradient(to bottom,transparent,#000 22%)}
.veil span{font-family:var(--sans);font-size:13px;color:var(--muted)}
.d-head{padding:18px 16px 6px;background:var(--card);border-top:1px solid var(--line)}
.d-head h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.d-head .pricebig{margin-top:6px;font-size:15px;font-variant-numeric:tabular-nums}
.d-head .pricebig .f{color:var(--muted)}
.spec{margin:0;padding:10px 16px 18px;background:var(--card);display:grid;grid-template-columns:76px 1fr;gap:8px 12px;font-size:14px;border-bottom:1px solid var(--line)}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-variant-numeric:tabular-nums}
.includes{margin-top:10px;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px}
.includes h2{font-size:15px;font-weight:700;margin-bottom:8px}
.inc{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.inc:first-of-type{border-top:0}
.inc .ds{color:var(--muted);font-size:13px}
.inc b{font-variant-numeric:tabular-nums;white-space:nowrap}
.note{padding:14px 16px;font-size:12.5px;color:var(--muted);line-height:1.6}

/* forms */
.panel{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:14px;margin-top:10px}
.panel h2{font-size:16px;font-weight:700}
.page-title{padding:20px 16px 4px}
.page-title h1{font-size:21px;font-weight:700}
.page-title p{margin:6px 0 0;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lb{font-size:13.5px;font-weight:600}
.field label em{font-style:normal;color:var(--red)}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.field textarea{min-height:96px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--err)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--err)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--red);flex:none}
.seg{display:flex;gap:6px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:grid;place-items:center;height:44px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-weight:500;text-align:center;padding:0 4px}
.seg input:checked+span{border-color:var(--ink);background:var(--ink);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}

/* cart */
.c-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.c-item .nm{font-weight:600;font-size:14.5px}
.c-item .ds{font-size:12.5px;color:var(--muted)}
.c-item .rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-weight:700;font-variant-numeric:tabular-nums}
.link{background:none;border:0;padding:2px 0;font-size:12.5px;color:var(--muted);text-decoration:underline}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.total b{font-size:21px;font-variant-numeric:tabular-nums}

/* done */
.done-head{padding:28px 16px 10px}
.done-head h1{font-size:21px;font-weight:700}
.done-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.kvs{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums;word-break:keep-all}
.kv .v.big{font-size:18px;font-weight:700;color:var(--red)}
.kv .v small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.howto{padding:18px 16px 0;font-size:14px;line-height:1.7}
.howto h2{font-size:15px;font-weight:700;margin-bottom:6px}
.howto ol{margin:0;padding-left:20px}

/* 주문제작: 한 화면에 질문 하나 */
.flow-top{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 0}
.back-ic{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:22px}
.back-ic:active{background:var(--soft)}
.stepno{font-size:13px;color:var(--muted);padding-right:12px;font-variant-numeric:tabular-nums}
.progress{height:3px;margin:2px 20px 0;background:var(--soft);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--red);border-radius:2px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.step{padding:0 20px 140px;animation:stepIn .32s cubic-bezier(.2,.8,.2,1)}
.step.rev{animation-name:stepBack}
@keyframes stepIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes stepBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.ask{font-size:25px;font-weight:700;line-height:1.38;letter-spacing:-.025em;margin:30px 0 26px}
.big-input{width:100%;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;font-size:22px;font-weight:600;padding:8px 0 10px;transition:border-color .2s}
.big-input:focus{outline:none;border-bottom-color:var(--red)}
.big-input::placeholder{color:#b9bcc6;font-weight:500}
textarea.big-input{font-size:18px;line-height:1.5;min-height:112px;resize:none}
.in-err{margin-top:8px;font-size:13px;color:var(--err);min-height:18px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:8px;word-break:keep-all;height:62px;padding:0 20px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-size:17px;font-weight:600;text-align:left;transition:transform .12s,border-color .15s,background .15s,color .15s}
.choice:active{transform:scale(.98)}
.choice.on{border-color:var(--red);background:#eaf2fd;color:var(--red)}
.choice svg{opacity:0;transition:opacity .15s}
.choice.on svg{opacity:1}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.qchip{height:40px;padding:0 16px;border-radius:20px;border:0;background:#e6eefa;color:var(--red);font-size:14.5px;font-weight:600;transition:transform .12s}
.qchip:active{transform:scale(.96)}
.rv{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;padding:15px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:15.5px}
.rv .k{color:var(--muted);font-size:14px}
.rv .v{font-weight:600;word-break:keep-all;white-space:pre-line}
.rv .e{font-size:13px;color:var(--red);font-weight:600}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--kb,0px) + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:456px;z-index:35;padding:8px;border-radius:22px;transition:bottom .2s}
.cta .btn{width:100%;height:56px;border-radius:16px;font-size:17px;transition:opacity .2s,background .2s}
.cta .btn:disabled{opacity:1;background:#b8d0f2;border-color:#b8d0f2}
@media (prefers-reduced-motion:reduce){.step{animation:none}.progress i,.choice,.cta{transition:none}}

.sug{display:flex;flex-direction:column;margin-top:6px}
.sug button{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:17px;font-weight:600}
.sug button:active{background:var(--soft)}
.sug mark{background:none;color:var(--red)}
.sug small{font-size:13px;font-weight:400;color:var(--muted);white-space:nowrap}
.mail{font-size:21px;font-weight:700;color:var(--red);word-break:break-all;margin:-6px 0 26px}
.choice.sub2{background:var(--soft);border-color:transparent;color:var(--ink)}

.choices.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices.grid .choice{height:56px;padding:0 16px;font-size:16px}
.choices.grid .choice.wide{grid-column:1/-1}
.pick-h{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 10px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.tg{height:44px;min-width:64px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:600;transition:transform .12s,background .15s,border-color .15s,color .15s}
.tg:active{transform:scale(.95)}
.tg.on{background:var(--red);border-color:var(--red);color:#fff}

/* 주문제작 소개 */
.intro{padding:34px 20px 0;animation:stepIn .32s cubic-bezier(.2,.8,.2,1)}
.fan{position:relative;height:150px;display:flex;justify-content:center;align-items:flex-end;margin-bottom:26px}
.fan .thumb{position:absolute;bottom:0;width:86px;box-shadow:0 8px 20px rgba(26,31,46,.12)}
.fan .thumb:nth-child(1){transform:translateX(-62px) rotate(-10deg)}
.fan .thumb:nth-child(2){transform:translateY(-10px);z-index:2}
.fan .thumb:nth-child(3){transform:translateX(62px) rotate(10deg)}
.fan .thumb .t1{font-size:6px}.fan .thumb .t2{font-size:11px}.fan .thumb .lines{top:38px}
.intro h1{font-size:26px;font-weight:700;line-height:1.38;letter-spacing:-.025em}
.intro .lead{margin:10px 0 26px;color:var(--muted);font-size:15.5px}
.feat{display:flex;flex-direction:column;background:var(--card);border-radius:18px;padding:4px 18px;box-shadow:0 1px 3px rgba(26,31,46,.06)}
.feat div{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:15px 0;border-bottom:1px solid var(--line)}
.feat div:last-child{border-bottom:0}
.feat svg{color:var(--red);margin-top:2px}
.feat b{display:block;font-size:15.5px}
.feat span{font-size:13.5px;color:var(--muted)}

/* floating: toast (dark glass) */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,10px);max-width:420px;width:calc(100% - 32px);padding:12px 16px;border-radius:16px;font-size:14px;color:#fff;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;
  background:linear-gradient(180deg,rgba(40,46,64,.78),rgba(26,31,46,.72));

/* ===== 유체적 · 입체적 UI ===== */

<div class="shell">
  <header class="top glass">
    <button class="logo" data-go="home" aria-label="팩토리얼 모의고사 처음 화면"><span class="mark">n<b>!</b></span><span>팩토리얼 모의고사</span></button>
    <button class="icon-btn" data-go="cart" aria-label="장바구니">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      <span class="badge" id="badgeTop" hidden>0</span>
    </button>
  </header>
  <main id="app"></main>
</div>

<nav class="nav glass" id="nav" aria-label="하단 메뉴">
  <span class="lens" id="lens" aria-hidden="true"></span>
  <button data-go="home" id="navHome">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v4h4M8 12h8M8 16h6"/></svg>
    모의고사
  </button>
  <button data-go="custom" id="navCustom">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/></svg>
    주문제작
  </button>
  <button data-go="cart" id="navCart">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
    장바구니
    <span class="badge" id="badgeNav" hidden>0</span>
  </button>
  <button data-go="account" id="navAcc">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
    내 정보
  </button>
</nav>
<div class="buybar glass" id="buybar" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet-bg" id="sheetBg" hidden>
  <div class="dlg glass" role="dialog" aria-modal="true" aria-labelledby="shT">
    <h2 id="shT"></h2><p id="shP"></p>
    <div class="sheet-btns"><button class="btn" data-sheet="close">돌아가기</button><button class="btn danger" data-sheet="ok" id="shOk">취소할게요</button></div>
  </div>
</div>

<script>
/* ===== 운영 전에 바꿀 값 ===== */
const SHOP = {
  name: '팩토리얼 모의고사',
  company: '에스피오',
  ceo: '○○○',
  bizNo: '신청 중',
  mailOrder: '신고 예정',
  address: '대구광역시 ○○구 ○○로 ○○',
  email: 'help@○○○.com',
  bank: '○○은행',
  account: '000-0000-0000-00',
  holder: '○○○(에스피오)'
};

const SUBJECTS = [
  {code:'01', name:'화법과 언어'},
  {code:'08', name:'영어Ⅱ'},
  {code:'13', name:'한국지리 탐구'},
  {code:'15', name:'정치'},
  {code:'16', name:'경제'}
];

const STEMS = {
  '01': ['다음은 학생의 발표이다. 발표에 활용된 말하기 전략으로 적절하지 않은 것은?', '<보기>의 탐구 과정에 대한 설명으로 가장 적절한 것은?'],
  '08': ['다음 글의 주제로 가장 적절한 것은?', '다음 빈칸에 들어갈 말로 가장 적절한 것은?'],
  '13': ['지도에 표시된 (가)~(라) 지역에 대한 설명으로 옳은 것은?', '다음 자료의 A~C 지역을 지도에서 고른 것은?'],
  '15': ['다음 자료에 나타난 정부 형태에 대한 설명으로 옳은 것은?', '밑줄 친 ㉠~㉣에 대한 설명으로 옳은 것은?'],
  '16': ['다음 그래프에 대한 분석으로 옳은 것은?', '갑국의 경제 상황에 대한 설명으로 옳은 것은?']
};

/* 예시 상품. 실제 회차·문항 수·분량으로 바꿔서 쓰면 됩니다. */
const PRODUCTS = [
  {id:'p01-5', code:'01', round:5, range:'기말 범위 전체 (누적)', obj:20, sub:7, score:100, pages:8, keyPages:6, isNew:true, order:9},
  {id:'p08-5', code:'08', round:5, range:'기말 범위 전체 (누적)', obj:22, sub:6, score:100, pages:8, keyPages:5, isNew:true, order:8},
  {id:'p15-5', code:'15', round:5, range:'기말 범위 전체 (누적)', obj:20, sub:5, score:100, pages:6, keyPages:5, isNew:true, order:7},
  {id:'p13-1', code:'13', round:1, range:'기말 범위 전체', obj:20, sub:5, score:100, pages:8, keyPages:5, isNew:true, order:3},
  {id:'p16-1', code:'16', round:1, range:'기말 범위 전체', obj:20, sub:5, score:100, pages:6, keyPages:5, isNew:true, order:2},
  {id:'p01-4', code:'01', round:4, range:'1~4단원 누적', obj:20, sub:7, score:100, pages:8, keyPages:6, order:6},
  {id:'p08-4', code:'08', round:4, range:'Lesson 1~5 누적', obj:22, sub:6, score:100, pages:8, keyPages:5, order:5},
  {id:'p15-4', code:'15', round:4, range:'1~3단원 누적', obj:20, sub:5, score:100, pages:6, keyPages:5, order:4}
];
const KEY_PRICE = 700;
const BUNDLE_PRICE = 2900;
const TF = {one:15900, three:25900, rush:3000};
function tfPrice(d){ return (d.plan && d.plan.startsWith('3') ? TF.three : TF.one) + (d.due && d.due.startsWith('3일') ? TF.rush : 0); }

/* ===== 상태 ===== */
const state = {view:'home', subject:'all', q:'', pid:null, order:null, custom:null};
let cart = [];
try { cart = JSON.parse(localStorage.getItem('fx-cart') || '[]'); } catch(e) { cart = []; }
cart = cart.filter(it => it.bundle ? SUBJECTS.some(s => s.code === it.bundle) : PRODUCTS.some(p => p.id === it.pid));
function saveCart(){ try { localStorage.setItem('fx-cart', JSON.stringify(cart)); } catch(e) {} }

let orders = [];
try { orders = JSON.parse(localStorage.getItem('fx-orders') || '[]'); } catch(e) { orders = []; }
function saveOrders(){ try { localStorage.setItem('fx-orders', JSON.stringify(orders)); } catch(e) {} }
const STAGES = {
  order: {steps:['주문 접수','입금 확인','PDF 발송'], msg:['입금을 기다리고 있어요','PDF를 보내드리고 있어요','이메일로 보내드렸어요']},
  custom: {steps:['신청 접수','입금 안내','입금 확인','제작 중','PDF 발송'], msg:['범위를 확인하고 있어요','이메일로 입금 안내를 보내드렸어요','입금이 확인되었어요','모의고사를 만들고 있어요','이메일로 보내드렸어요']}
};
const CANCEL_UNTIL = {order:1, custom:2}; /* 이 단계까지 취소 가능 */
function trackCard(o){
  const st = STAGES[o.kind]; const idx = orders.indexOf(o);
  if (o.cancelled) {
    return `<div class="trk cx"><div class="h"><span class="t">${esc(o.title)}</span><span class="no">${esc(o.no)}</span></div><div class="msg">취소되었어요</div></div>`;
  }
  const canCancel = o.stage <= CANCEL_UNTIL[o.kind];
  return `<div class="trk">
    <div class="h"><span class="t">${esc(o.title)}</span><span class="no">${esc(o.no)}</span></div>
    <div class="msg">${st.msg[o.stage]}</div>
    <div class="stepper" style="--n:${st.steps.length}">${st.steps.map((x, k) => `<span class="${k < o.stage ? 'd' : k === o.stage ? 'c' : ''}">${x}</span>`).join('')}</div>
    ${canCancel ? `<div class="act"><button class="cancel" data-cancel="${idx}">${o.kind === 'order' ? '주문 취소' : '신청 취소'}</button></div>` : ''}
  </div>`;
}

/* 확인 시트 */
let sheetFn = null, sheetReturn = null;
function openSheet(title, body, okLabel, fn){
  document.getElementById('shT').textContent = title;
  document.getElementById('shP').textContent = body;
  document.getElementById('shOk').textContent = okLabel;
  sheetFn = fn; sheetReturn = document.activeElement;
  document.getElementById('sheetBg').hidden = false;
  document.querySelector('[data-sheet="close"]').focus();
}
function closeSheet(){
  document.getElementById('sheetBg').hidden = true; sheetFn = null;
  if (sheetReturn && document.contains(sheetReturn)) sheetReturn.focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('sheetBg').hidden) closeSheet(); });
document.getElementById('sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });

/* ===== 도우미 ===== */
const $app = document.getElementById('app');
const won = n => n.toLocaleString('ko-KR') + '원';
const subj = code => SUBJECTS.find(s => s.code === code);
const prod = id => PRODUCTS.find(p => p.id === id);
function pTitle(p){ return p.premium ? p.title : `${subj(p.code).name} ${p.round}회`; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const roundsOf = code => PRODUCTS.filter(p => p.code === code).length;
function itemPrice(it){ if (it.bundle) return BUNDLE_PRICE; const p = prod(it.pid); return p.premium ? p.price : KEY_PRICE; }
function itemName(it){ if (it.bundle) return `${subj(it.bundle).name} 답지 전 회차 (${roundsOf(it.bundle)}회분)`; const p = prod(it.pid); return p.premium ? `${p.title} (문제지 ${p.sets}세트 + 답지)` : `${pTitle(p)} 답지·해설`; }
function cartTotal(){ return cart.reduce((a,it) => a + itemPrice(it), 0); }
const inCart = id => cart.some(it => it.pid === id);

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
function updateChrome(){
  document.body.classList.toggle('tf', ['customIntro','custom','customDone'].includes(state.view));
  ['badgeTop','badgeNav'].forEach(id => { const b = document.getElementById(id); b.textContent = cart.length; b.hidden = cart.length === 0; });
  document.getElementById('navHome').setAttribute('aria-current', state.view === 'home' ? 'page' : 'false');
  document.getElementById('navCustom').setAttribute('aria-current', ['customIntro','custom','customDone'].includes(state.view) ? 'page' : 'false');
  const idx = state.view === 'home' ? 0 : ['customIntro'].includes(state.view) ? 1 : ['cart','checkout'].includes(state.view) ? 2 : state.view === 'account' ? 3 : -1;
  document.getElementById('navAcc').setAttribute('aria-current', state.view === 'account' ? 'page' : 'false');
  const lens = document.getElementById('lens');
  lens.style.opacity = idx < 0 ? 0 : 1;
  if (idx >= 0) lens.style.transform = `translateX(${idx * 100}%)`;
  document.getElementById('navCart').setAttribute('aria-current', ['cart','checkout','done'].includes(state.view) ? 'page' : 'false');
  const onDetail = state.view === 'detail';
  document.getElementById('nav').hidden = onDetail || ['custom','customDone','done'].includes(state.view);
  const bar = document.getElementById('buybar');
  bar.hidden = !onDetail;
  if (onDetail) {
    const p = prod(state.pid);
    if (inCart(p.id)) bar.innerHTML = `<button class="btn ghost" data-go="home">더 둘러보기</button><button class="btn ink" data-go="cart">장바구니 보기</button>`;
    else if (p.premium) bar.innerHTML = `<button class="btn primary" data-add="${p.id}">${won(p.price)} 담기</button>`;
    else bar.innerHTML = `<button class="btn ghost" data-free="${p.id}">시험지 무료 받기</button><button class="btn primary" data-add="${p.id}">답지 ${won(KEY_PRICE)} 담기</button>`;
  }
}
function go(view, extra){
  Object.assign(state, {view}, extra || {});
  render(); window.scrollTo(0,0);
}

/* ===== 썸네일 / 미리보기 ===== */
function thumb(p){
  const s = subj(p.code);
  return `<div class="thumb${p.premium ? ' premium' : ''}" aria-hidden="true">
    <div class="t1">2학기 기말 대비</div>
    <div class="t2">${p.premium ? 'Thefactorial' : esc(s.name)}</div>
    <div class="lines"></div>
    <div class="rnd">${p.premium ? '3세트' : p.round + '회'}</div>
  </div>`;
}
function sheet(p){
  const s = subj(p.code); const st = STEMS[p.code];
  const opts = '①②③④⑤'.split('').map(n => `<div class="opt">${n}<div class="ln"></div></div>`).join('');
  const lines = n => Array.from({length:n}, (_, i) => `<div class="ln" style="width:${[100,96,88,100,72,92][i % 6]}%"></div>`).join('');
  return `<div class="sheet" role="img" aria-label="${esc(pTitle(p))} 시험지 1쪽 미리보기">
    <div class="sh-top"><span>2026학년도 2학기 기말고사 대비</span><span>${p.premium ? '파이널 1세트' : `제 ${p.round} 회`}</span></div>
    <div class="sh-title">${esc(s.name)}</div>
    <div class="sh-row"><span>과목코드 ${s.code} · ${p.score}점</span><span>2학년 (　)반 (　)번 성명 (　　　　)</span></div>
    <div class="sh-body">
      <div>
        <div class="q"><p>1. ${st[0]} <span class="pts">[3점]</span></p><div class="box">${lines(5)}</div>${opts}</div>
        <div class="q"><p>2. ${st[1]} <span class="pts">[3점]</span></p>${lines(3)}${opts}</div>
      </div>
      <div>
        <div class="q"><p>3. ${st[0]} <span class="pts">[3.5점]</span></p><div class="box">${lines(6)}</div>${opts}</div>
        <div class="q"><p>4. ${st[1]} <span class="pts">[3점]</span></p>${lines(4)}${opts}</div>
      </div>
    </div>
    <div class="veil"><span>1 / ${p.pages}쪽 미리보기</span></div>
  </div>`;
}

/* ===== 화면: 모의고사 목록 ===== */
function viewHome(){
  const q = state.q.trim();
  const count = code => PRODUCTS.filter(p => code === 'all' || p.code === code).length;
  let items = PRODUCTS.filter(p => state.subject === 'all' || p.code === state.subject)
    .filter(p => !q || (pTitle(p) + subj(p.code).name + p.code).includes(q))
    .sort((a,b) => b.order - a.order);
  const tiles = [{code:'all', name:'전체'}].concat(SUBJECTS);
  const heading = state.subject === 'all' ? '전체 모의고사' : `${subj(state.subject).name} 모의고사`;
  return `
  <div class="subjects" role="group" aria-label="과목 고르기">
    ${tiles.map(s => `<button class="subj" data-subject="${s.code}" aria-pressed="${state.subject === s.code}"><span class="n">${esc(s.name)}</span><span class="k">${s.code === 'all' ? '' : s.code + ' · '}${count(s.code)}개</span></button>`).join('')}
  </div>
  <div class="list-head"><h2>${esc(heading)}</h2><span>${items.length}개</span></div>
  <div class="list">
    ${items.length ? items.map(p => `
      <button class="item" data-pid="${p.id}">
        ${thumb(p)}
        <div class="info">
          <div class="title">${esc(pTitle(p))}${p.isNew ? '<span class="new">NEW</span>' : ''}</div>
          <div class="sub">객관식 ${p.obj} · 서술형 ${p.sub} · 50분</div>
          <div class="prices">${p.premium
            ? `<span class="f">문제지 ${p.sets}세트+답지</span> <b>${won(p.price)}</b>`
            : `<span class="f">시험지 무료 ·</span> <b>답지 ${won(KEY_PRICE)}</b>`}</div>
        </div>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>`).join('') : `<div class="empty">아직 올라온 모의고사가 없습니다.</div>`}
  </div>
  <button class="tf-card" data-go="custom">
    <span class="w">THEFACTORIAL</span>
    <b>나만을 위한 모의고사.</b>
    <span class="s">15,900원부터</span>
  </button>
  ${footer()}`;
}

/* ===== 화면: 상세 ===== */
function viewDetail(){
  const p = prod(state.pid); const s = subj(p.code);
  const inc = p.premium
    ? `<div class="inc"><div>문제지 ${p.sets}세트<div class="ds">PDF ${p.pages}쪽</div></div><b>포함</b></div>
       <div class="inc"><div>답지·해설·서술형 채점기준<div class="ds">PDF ${p.keyPages}쪽</div></div><b>포함</b></div>`
    : `<div class="inc"><div>시험지<div class="ds">PDF ${p.pages}쪽</div></div><b>무료</b></div>
       <div class="inc"><div>답지·해설·서술형 채점기준<div class="ds">PDF ${p.keyPages}쪽 · 입금 확인 후 이메일로</div></div><b>${won(KEY_PRICE)}</b></div>`;
  return `
  <button class="backlink" data-go="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>목록으로</button>
  <div class="preview-wrap">${sheet(p)}</div>
  <div class="d-head">
    <h1>${esc(pTitle(p))}</h1>
    <div class="pricebig">${p.premium ? `<b>${won(p.price)}</b>` : `<span class="f">시험지 무료 ·</span> <b>답지 ${won(KEY_PRICE)}</b>`}</div>
  </div>
  <dl class="spec">
    <dt>과목</dt><dd>${esc(s.name)} (${s.code})</dd>
    <dt>대상</dt><dd>포산고 2학년 2학기 기말</dd>
    <dt>범위</dt><dd>${esc(p.range)}</dd>
    <dt>문항</dt><dd>객관식 ${p.obj} + 서술형 ${p.sub} · ${p.score}점</dd>
    <dt>시간</dt><dd>50분</dd>
    <dt>파일</dt><dd>PDF (B4 인쇄)</dd>
  </dl>
  <section class="includes"><h2>받는 파일</h2>${inc}</section>
  ${!p.premium && roundsOf(p.code) > 1 ? `<section class="includes bundle"><div class="inc"><div>${esc(s.name)} 답지 전 회차 묶음<div class="ds">${roundsOf(p.code)}회분 · 한 번에 받기</div></div>
    ${cart.some(it => it.bundle === p.code) ? '<b>담김</b>' : `<button class="btn sm ink" data-bundle="${p.code}">${won(BUNDLE_PRICE)} 담기</button>`}</div></section>` : ''}
  ${footer()}`;
}

/* ===== 화면: 장바구니 ===== */
function viewCart(){
  const track = orders.length ? `
    <h2 class="sec-h">진행 상황<span>${orders.length}건</span></h2>
    <div class="trks">${orders.slice().reverse().map(trackCard).join('')}</div>` : '';
  return `
  ${track}
  <h2 class="sec-h">장바구니<span>${cart.length}개</span></h2>
  <section class="panel" style="margin-top:0">
    ${cart.length ? cart.map((it, i) => `
      <div class="c-item"><div><div class="nm">${esc(itemName(it))}</div></div>
      <div class="rt">${won(itemPrice(it))}<button class="link" data-del="${i}">삭제</button></div></div>`).join('')
      + `<div class="total"><span>합계</span><b>${won(cartTotal())}</b></div>
         <button class="btn primary block" data-go="checkout">무통장입금으로 주문</button>`
      : `<div class="empty-paper">담긴 상품이 없습니다.</div><button class="btn block" data-go="home">모의고사 보러 가기</button>`}
  </section>
  ${footer()}`;
}

/* ===== 화면: 주문서 ===== */
function viewCheckout(){
  if (!cart.length) return viewCart();
  return `

function render(){
  const views = {account:viewAccount, customIntro:viewCustomIntro, home:viewHome, detail:viewDetail, cart:viewCart, checkout:viewCheckout, done:viewDone, custom:viewCustom, customDone:viewCustomDone};
  $app.innerHTML = (views[state.view] || viewHome)();
  updateChrome();
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', e => {
    state.q = e.target.value;
    const pos = e.target.selectionStart; render();
    const n = document.getElementById('q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch(_) {}
  });
  const of = document.getElementById('orderForm'); if (of) of.addEventListener('submit', submitOrder);
  const cfFile = document.getElementById('cfFile');
  if (cfFile) cfFile.addEventListener('change', () => {
    const fs = state.cf.files; let skipped = 0;
    Array.from(cfFile.files).forEach(f => {
      if (fs.length >= 10 || f.size > 20 * 1024 * 1024) { skipped++; return; }
      fs.push({name:f.name, url: f.type.startsWith('image/') ? URL.createObjectURL(f) : '', file:f});
    });
    if (skipped) toast('파일은 10개까지, 하나에 20MB까지 올릴 수 있어요.');
    render();
  });
  const ci = document.getElementById('cfIn');
  if (ci && state.view === 'custom') {
    const st = CSTEPS[state.cf.i];
    ci.addEventListener('input', () => {
      const nb = document.getElementById('cfNext'); if (nb) nb.disabled = !cfValid(st, ci.value);
      document.getElementById('cfErr').textContent = '';
      const sg = document.getElementById('cfSug'); if (sg) sg.innerHTML = sugHTML(ci.value);
    });
    ci.addEventListener('keydown', e => {
      if (e.key === 'Enter' && ci.tagName === 'INPUT') {
        e.preventDefault();
        const first = document.querySelector('#cfSug button');
        if (first) first.click(); else { const nb = document.getElementById('cfNext'); if (nb) nb.click(); }
      }
    });
    try { ci.focus({preventScroll:true}); const n = ci.value.length; ci.setSelectionRange(n, n); } catch(_) {}
  }
}

function setErr(id, msg){ const f = document.getElementById(id); if (!f) return; f.classList.toggle('bad', !!msg); const e = f.querySelector('.err'); if (e) e.textContent = msg || ''; }
const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const code4 = () => String(Math.floor(1000 + Math.random() * 9000));

function submitOrder(e){
  e.preventDefault();
  const name = document.getElementById('oName').value.trim();
  const email = document.getElementById('oEmail').value.trim();
  const agree = document.getElementById('oAgree').checked;
  setErr('f-name', name ? '' : '입금자명을 적어 주세요.');
  setErr('f-email', emailOk(email) ? '' : '이메일 주소를 다시 확인해 주세요.');
  if (!name || !emailOk(email)) return;
  if (!agree) { toast('환불 안내와 개인정보 수집에 동의해 주세요.'); return; }
  withLogin(() => placeOrder(name, email));
}
async function placeOrder(name, email){
  const c = code4();
  const d = new Date(); const md = `${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  state.order = {no:`F${md}-${c}`, depositor:`${name}${c}`, email, total:cartTotal(), items:cart.slice()};
  const rec = {kind:'order', no:state.order.no, title: cart.length > 1 ? `${itemName(cart[0])} 외 ${cart.length - 1}건` : itemName(cart[0]), stage:0, cancelled:false,
    total:state.order.total, depositor:state.order.depositor, email, items:cart.map(it => ({...it, name:itemName(it), price:itemPrice(it)}))};
  try { await saveRecord(rec); } catch(err) { toast('주문을 저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.'); return; }
  cart = []; saveCart();
  go('done');
}

  if (t.dataset.acc) {
    const a = t.dataset.acc;
    if (a === 'mail') { AUTH.mail = AUTH.mail === false; if (FB_ON) fbDb.collection('users').doc(AUTH.uid).update({mail: AUTH.mail}).catch(() => {}); else saveAuth(); render(); return; }
    if (a === 'help') { toast(`${SHOP.email}로 주문번호와 함께 보내 주세요.`); return; }
    if (a === 'logout') { openSheet('로그아웃할까요?', '다시 로그인하면 주문 내역과 혜택은 그대로 있어요.', '로그아웃', () => { if (FB_ON) { fbAuth.signOut(); toast('로그아웃했어요.'); return; } AUTH = {}; saveAuth(); render(); toast('로그아웃했어요.'); }); document.getElementById('shOk').className = 'btn ink'; return; }
    if (a === 'leave') { openSheet('정말 탈퇴하시겠어요?', '탈퇴하면 받은 시험지, 무료 답지, 할인 혜택이 모두 사라지고 되돌릴 수 없어요.', '탈퇴할게요', () => { if (FB_ON) { leaveAccount(); return; } AUTH = {}; saveAuth(); render(); toast('탈퇴 처리됐어요.'); }); document.getElementById('shOk').className = 'btn danger'; return; }
  }
  if (t.dataset.scrollto) { const el = document.getElementById(t.dataset.scrollto); if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); return; }
  if (t.dataset.plan) { startCustom(); state.cf.d.plan = t.dataset.plan; state.cf.i = 1; render(); return; }
  if (t.dataset.bundle) {
    const code = t.dataset.bundle;
    if (!cart.some(it => it.bundle === code)) {
      cart = cart.filter(it => !(it.pid && prod(it.pid).code === code));
      cart.push({bundle:code}); saveCart();
    }
    render(); toast('묶음을 장바구니에 담았습니다.'); return;
  }
  if (t.dataset.sheet) {
    if (t.dataset.sheet === 'ok' && sheetFn) { const fn = sheetFn; closeSheet(); fn(); } else closeSheet();
    return;
  }
  if (t.dataset.cancel !== undefined) {
    const o = orders[Number(t.dataset.cancel)]; if (!o) return;
    const paid = o.kind === 'order' ? o.stage >= 1 : o.stage >= 2;
    const body = (o.kind === 'order' ? 'PDF를 받은 이후엔 환불이 불가능해요.' : '제작이 시작된 이후엔 환불이 불가능해요.')
      + (paid ? ' 지금 취소하면 입금하신 금액을 돌려드려요.' : ' 아직 입금 전이라 바로 취소돼요.');
    document.getElementById('shOk').className = 'btn danger';
    openSheet(o.kind === 'order' ? '정말 주문을 취소하시겠어요?' : '정말 신청을 취소하시겠어요?', body, '취소할게요', () => {
      cancelRecord(o).then(() => { render(); toast('취소되었어요.'); }).catch(() => toast('취소하지 못했어요. 다시 시도해 주세요.'));
    });
    return;
  }
  if (t.dataset.rmfile !== undefined) {
    const fs = state.cf.files; const f = fs[Number(t.dataset.rmfile)];
    if (f && f.url) { try { URL.revokeObjectURL(f.url); } catch(_) {} }
    fs.splice(Number(t.dataset.rmfile), 1);
    if (!fs.length && state.cf.d.files && state.cf.d.files.startsWith('시험지')) delete state.cf.d.files;
    render(); return;
  }
  if (t.dataset.tog) {
    const [kind, val] = t.dataset.tog.split('|'); const arr = state.cf.pick[kind];
    const i = arr.indexOf(val); if (i >= 0) arr.splice(i, 1); else arr.push(val);
    t.classList.toggle('on', i < 0); t.setAttribute('aria-pressed', i < 0);
    const n = pickCount(); const nb = document.getElementById('cfNext');
    nb.disabled = !n; nb.textContent = n ? n + '개 선택 완료' : '골라 주세요';
    return;
  }
  if (t.dataset.cfq !== undefined) { state.cf.d[CSTEPS[state.cf.i].key] = t.dataset.cfq; cfAdvance(); return; }
  if (t.dataset.cfedit !== undefined) { const cf = state.cf; cf.returnTo = cf.i; cf.i = Number(t.dataset.cfedit); cf.editing = true; cf.rangePick = false; cf.dir = 'back'; render(); window.scrollTo(0,0); return; }
  if (t.dataset.cf) {
    if (t.dataset.cf === 'start') { startCustom(); return; }
    const cf = state.cf; const act = t.dataset.cf;
    if (act === 'back') {
      cf.dir = 'back';
      if (cf.rangePick) { cf.rangePick = false; render(); return; }
      if (cf.upPick) { cf.upPick = false; render(); return; }
      if (cf.editing) { cf.i = cf.returnTo ?? CSTEPS.length; cf.editing = false; }
      else if (cf.i === 0) { go('customIntro'); return; }
      else cf.i--;
      render(); window.scrollTo(0,0); return;
    }
    if (act === 'rangePick') { cf.rangePick = true; cf.pick = cf.pick || {u:[], m:[]}; cf.dir = 'fwd'; render(); window.scrollTo(0,0); return; }
    if (act === 'pickDone') {
      const p = cf.pick; cf.d.range = [p.u.join(', '), p.m.join(', ')].filter(Boolean).join(' / ');
      cf.rangePick = false; cfAdvance(); return;
    }
    if (act === 'upPick') { cf.upPick = true; cf.dir = 'fwd'; render(); window.scrollTo(0,0); return; }
    if (act === 'filesDone') { if (!cf.files.length) return; cf.upPick = false; cf.d.files = `시험지 ${cf.files.length}개 첨부`; cfAdvance(); return; }
    if (act === 'emailEdit') { cf.emailEdit = true; cf.dir = 'fwd'; render(); return; }
    if (act === 'next') {
      const st = CSTEPS[cf.i]; const v = document.getElementById('cfIn').value.trim();
      if (!cfValid(st, v)) { document.getElementById('cfErr').textContent = st.type === 'email' ? '이메일 주소를 다시 확인해 주세요.' : ''; return; }
      cf.d[st.key] = v; cfAdvance(); return;
    }
    if (act === 'submit') {
      withLogin(async () => {
        const d = cf.d;
        try { localStorage.setItem('fx-cf', JSON.stringify({school:d.school, email:d.email})); } catch(_) {}
        state.custom = Object.assign({no:`C-${code4()}`}, d);
        const rec = {kind:'custom', no:state.custom.no, title:`THEFACTORIAL ${d.plan.split(' ')[0]} · ${d.subject}`, stage:0, cancelled:false,
          total:tfPrice(d), email:d.email, answers:Object.assign({}, d), fileNames:cf.files.map(f => f.name)};
        try { await saveRecord(rec); } catch(err) { toast('신청을 저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.'); return; }
        go('customDone');
      });
      return;
    }
  }
  if (t.dataset.pid) { go('detail', {pid:t.dataset.pid}); return; }
  if (t.dataset.subject) { state.subject = t.dataset.subject; state.q = ''; render(); return; }
  if (t.dataset.add) {
    if (cart.some(it => it.bundle === prod(t.dataset.add).code)) { toast('이미 담은 묶음에 들어 있어요.'); return; }
    if (!inCart(t.dataset.add)) { cart.push({pid:t.dataset.add}); saveCart(); }
    updateChrome(); toast('장바구니에 담았습니다.'); return;
  }
  if (t.dataset.free) { toast('실제 사이트에서는 여기서 시험지 PDF가 바로 받아집니다.'); return; }
  if (t.dataset.del) { cart.splice(Number(t.dataset.del), 1); saveCart(); render(); return; }
  if (t.dataset.copy) {
    const v = t.dataset.copy;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v).then(() => toast('복사했습니다.'), () => toast(`복사가 안 됩니다. 직접 적어 주세요: ${v}`));
    } else toast(`직접 적어 주세요: ${v}`);
  }
});

function kbOffset(){
  const vv = window.visualViewport; if (!vv) return;
  const off = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty('--kb', off + 'px');
}
if (window.visualViewport) { visualViewport.addEventListener('resize', kbOffset); visualViewport.addEventListener('scroll', kbOffset); }

/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCG41zwm7Rm-ugRz6gcTKdfADPEyKJDXjQ",
  authDomain: "factorial-e1571.firebaseapp.com",
  projectId: "factorial-e1571",
  storageBucket: "factorial-e1571.firebasestorage.app",
  messagingSenderId: "109452600202",
  appId: "1:109452600202:web:690108cbcbf4967bc41e73"
};
const FB_ON = typeof firebase !== 'undefined';
let fbAuth = null, fbDb = null, unOrders = null, unUser = null;

/* 초대 링크: ?invite=코드 를 기억해 둠 */
try { const inv = new URLSearchParams(location.search).get('invite'); if (inv) localStorage.setItem('fx-invite', inv.slice(0, 12)); } catch(_) {}

function softRender(){ if (['cart','account','home'].includes(state.view)) render(); else updateChrome(); }
function inApp(){ return /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|everytimeApp|DaumApps/i.test(navigator.userAgent); }
function inAppGuide(){
  if (/KAKAOTALK/i.test(navigator.userAgent)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); return; }
  document.getElementById('shOk').className = 'btn ink';
  openSheet('다른 브라우저에서 열어 주세요', '카페나 SNS 앱 안에서는 구글 로그인이 막혀 있어요. 오른쪽 위 메뉴에서 "다른 브라우저로 열기"를 누르거나 주소를 복사해 크롬이나 사파리에서 열어 주세요.', '주소 복사', () => {
    try { navigator.clipboard.writeText(location.href).then(() => toast('주소를 복사했어요.')); } catch(_) { toast(location.href); }
  });
}
function googleLogin(){
  if (!FB_ON) return Promise.resolve(null);
  if (inApp()) { inAppGuide(); return Promise.reject(new Error('inapp')); }
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:'select_account'});
  return fbAuth.signInWithPopup(p).catch(err => {
    const c = err && err.code;
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') throw err;
    const msg = {'auth/unauthorized-domain':'이 주소는 아직 로그인이 허용되지 않았어요.', 'auth/operation-not-allowed':'구글 로그인이 아직 켜져 있지 않아요.', 'auth/popup-blocked':'팝업이 막혔어요. 팝업을 허용한 뒤 다시 눌러 주세요.', 'auth/network-request-failed':'인터넷 연결을 확인해 주세요.'}[c];
    toast((msg || '로그인하지 못했어요. 다시 시도해 주세요.') + (c ? ` (${c.replace('auth/', '')})` : ''));
    console.error('login error', err);
    throw err;
  });
}
/* 로그인이 필요한 동작: 안 되어 있으면 이 자리에서 로그인부터 */
function withLogin(fn){
  if (!FB_ON || (fbAuth && fbAuth.currentUser)) { fn(); return; }
  googleLogin().then(() => { AUTH.uid = fbAuth.currentUser.uid; AUTH.email = AUTH.email || fbAuth.currentUser.email; fn(); }).catch(() => {});
}
async function saveRecord(rec){
  if (!FB_ON) { orders.push(rec); saveOrders(); return; }
  const u = fbAuth.currentUser;
  await fbDb.collection('orders').add(Object.assign(rec, {uid:u.uid, account:u.email, createdAt: firebase.firestore.FieldValue.serverTimestamp()}));
}
async function cancelRecord(o){
  if (!FB_ON || !o.id) { o.cancelled = true; saveOrders(); return; }
  await fbDb.collection('orders').doc(o.id).update({cancelled:true, cancelledAt: firebase.firestore.FieldValue.serverTimestamp()});
}
async function leaveAccount(){
  const u = fbAuth.currentUser; if (!u) return;
  try {
    await fbDb.collection('users').doc(u.uid).delete().catch(() => {});
    await u.delete();
    toast('탈퇴 처리됐어요.');
  } catch(err) {
    if (err && err.code === 'auth/requires-recent-login') toast('보안을 위해 다시 로그인한 뒤 탈퇴해 주세요.');
    else toast('탈퇴하지 못했어요. 문의해 주세요.');
  }
}
async function ensureUser(u){
  const ref = fbDb.collection('users').doc(u.uid);
  const snap = await ref.get();
  if (!snap.exists) {
    let invitedBy = null; try { invitedBy = localStorage.getItem('fx-invite'); } catch(_) {}
    await ref.set({email:u.email, name:u.displayName || '', inviteCode: inviteCode(u.email), invitedBy: invitedBy || null,
      freeKeys:0, invited:0, mail:true, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
  }
}
if (FB_ON) {
  firebase.initializeApp(firebaseConfig);
  fbAuth = firebase.auth(); fbDb = firebase.firestore();
  orders = [];
  fbAuth.onAuthStateChanged(async u => {
    if (unOrders) { unOrders(); unOrders = null; }
    if (unUser) { unUser(); unUser = null; }
    if (!u) { AUTH = {}; orders = []; softRender(); return; }
    AUTH = {uid:u.uid, email:u.email, name:u.displayName || ''};
    try { await ensureUser(u); } catch(_) {}
    unUser = fbDb.collection('users').doc(u.uid).onSnapshot(d => { if (d.exists) { Object.assign(AUTH, d.data(), {uid:u.uid, email:u.email}); softRender(); } }, () => {});
    unOrders = fbDb.collection('orders').where('uid', '==', u.uid).onSnapshot(q => {
      orders = q.docs.map(d => Object.assign({id:d.id}, d.data()))
        .sort((a, b) => ((a.createdAt && a.createdAt.seconds) || 0) - ((b.createdAt && b.createdAt.seconds) || 0));
      softRender();
    }, () => {});
    softRender();
  });
}

render();
</script>
