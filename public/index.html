const examCache = new Map();
const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
const dayStart = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const KDAY = ['일','월','화','수','목','금','토'];
const mdw = d => `${d.getMonth()+1}월 ${d.getDate()}일(${KDAY[d.getDay()]})`;
async function loadExam(d){
  const info = d.schoolInfo || {};
  if (!info.code || !info.office || !NEIS_KEY) return null;
  const gradeKey = {'1학년':'ONE_GRADE_EVENT_YN','2학년':'TW_GRADE_EVENT_YN','3학년':'THREE_GRADE_EVENT_YN'}[d.grade];
  const key = info.code + '|' + d.grade;
  if (examCache.has(key)) return examCache.get(key);
  const from = dayStart(new Date()), to = new Date(from.getTime() + 150 * 86400000);
  const url = `https://open.neis.go.kr/hub/SchoolSchedule?KEY=${NEIS_KEY}&Type=json&pIndex=1&pSize=300&ATPT_OFCDC_SC_CODE=${info.office}&SD_SCHUL_CODE=${info.code}&AA_FROM_YMD=${ymd(from)}&AA_TO_YMD=${ymd(to)}`;
  let exam = null;
  try {
    const j = await fetch(url).then(r => r.json());
    const rows = (j.SchoolSchedule && j.SchoolSchedule[1] && j.SchoolSchedule[1].row) || [];
    const hit = rows.filter(x => /(고사|시험|지필)/.test(x.EVENT_NM) && !/(모의|학력|수능|전국연합|대학수학|검정)/.test(x.EVENT_NM) && (!gradeKey || x[gradeKey] !== 'N'))
      .sort((a, b) => a.AA_YMD.localeCompare(b.AA_YMD))[0];
    if (hit) {
      const y = hit.AA_YMD;
      exam = {name: hit.EVENT_NM.replace(/\(.*?\)/g, '').replace(/(\d학기)(\S)/, '$1 $2').trim(), date: new Date(+y.slice(0,4), +y.slice(4,6) - 1, +y.slice(6,8))};
    }
  } catch(_) { exam = null; }
  examCache.set(key, exam);
  return exam;
}

function render(){
  if (state.view !== 'admin' && adm.unsub) { adm.unsub(); adm.unsub = null; adm.list = null; }
  const views = {admin:viewAdmin, account:viewAccount, customIntro:viewCustomIntro, home:viewHome, detail:viewDetail, cart:viewCart, checkout:viewCheckout, done:viewDone, custom:viewCustom, customDone:viewCustomDone};
  $app.dataset.view = state.view;
  $app.innerHTML = (views[state.view] || viewHome)();
  updateChrome();
  try { if (window.clarity) window.clarity('set', 'screen', state.view); } catch(_) {}
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', e => {
    state.q = e.target.value;
    document.querySelector('.catalog-results').innerHTML = homeResults();
    document.querySelector('[data-clear-search]').hidden = !state.q;
  });
  const of = document.getElementById('orderForm'); if (of) of.addEventListener('submit', submitOrder);
  const cfFile = document.getElementById('cfFile');
  if (cfFile) cfFile.addEventListener('change', () => {
    const fs = state.cf.files; let skipped = 0;
    Array.from(cfFile.files).forEach(f => {
      if (fs.length >= 10 || f.size > 20 * 1024 * 1024) { skipped++; return; }
      fs.push({name:f.name, url: f.type.startsWith('image/') ? URL.createObjectURL(f) : '', file:f});
    });
    if (skipped) toast('파일은 10개까지, 하나에 20MB까지 올릴 수 있어요.');
    render();
  });
  const ci = document.getElementById('cfIn');
  if (ci && state.view === 'custom') {
    const st = CSTEPS[state.cf.i];
    ci.addEventListener('input', () => {
      const nb = document.getElementById('cfNext'); if (nb) nb.disabled = !cfValid(st, ci.value);
      document.getElementById('cfErr').textContent = '';
      if (document.getElementById('cfSug')) updateSchoolSug(ci.value);
    });
    ci.addEventListener('keydown', e => {
      if (e.key === 'Enter' && ci.tagName === 'INPUT') {
        e.preventDefault();
        const first = document.querySelector('#cfSug button');
        if (first) first.click(); else { const nb = document.getElementById('cfNext'); if (nb) nb.click(); }
      }
    });
    if (document.getElementById('cfSug')) updateSchoolSug(ci.value);
    try { ci.focus({preventScroll:true}); const n = ci.value.length; ci.setSelectionRange(n, n); } catch(_) {}
  }
}

function setErr(id, msg){ const f = document.getElementById(id); if (!f) return; f.classList.toggle('bad', !!msg); const input = f.querySelector('input,select,textarea'); if (input) input.setAttribute('aria-invalid', String(!!msg)); const e = f.querySelector('.err'); if (e) e.textContent = msg || ''; }
const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const code4 = () => String(Math.floor(1000 + Math.random() * 9000));

function submitOrder(e){
  e.preventDefault();
  const name = document.getElementById('oName').value.trim();
  const email = document.getElementById('oEmail').value.trim();
  const agree = document.getElementById('oAgree').checked;
  setErr('f-name', name ? '' : '입금자명을 적어 주세요.');
  setErr('f-email', emailOk(email) ? '' : '이메일 주소를 다시 확인해 주세요.');
  if (!name || !emailOk(email)) { document.getElementById(!name ? 'oName' : 'oEmail').focus(); return; }
  if (!agree) {
    const row = document.getElementById('agreeRow');
    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
    row.scrollIntoView({block:'center', behavior:'smooth'});
    toast('동의해야 주문할 수 있어요.'); return;
  }
  withLogin(async () => {
    const button = e.target.querySelector('[type="submit"]');
    if (button.disabled) return;
    button.disabled = true; button.textContent = '주문 저장 중…'; button.setAttribute('aria-busy','true');
    try { await placeOrder(name, email, document.getElementById('oPhone').value.replace(/\D/g, '')); }
    finally { if (button.isConnected) { button.disabled = false; button.textContent = '주문 완료'; button.removeAttribute('aria-busy'); } }
  });
}
async function placeOrder(name, email, phone){
  const c = code4();
  const d = new Date(); const md = `${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const free = freeUse();
  state.order = {no:`F${md}-${c}`, depositor:`${name}${c}`, email, total:payTotal(), free, items:cart.slice()};
  const rec = {kind:'order', no:state.order.no, title: cart.length > 1 ? `${itemName(cart[0])} 외 ${cart.length - 1}건` : itemName(cart[0]), stage:0, cancelled:false,
    total:state.order.total, freeUse: free, depositor:state.order.depositor, email, phone: phone || '', items:cart.map(it => ({...it, name:itemName(it), price:itemPrice(it)}))};
  try { await saveRecord(rec); } catch(err) { toast('주문을 저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.'); return; }
  cart = []; saveCart();
  go('done');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-toss],[data-share],[data-go],[data-pid],[data-subject],[data-add],[data-free],[data-del],[data-copy],[data-cf],[data-cfc],[data-cfq],[data-cfedit],[data-tog],[data-rmfile],[data-cancel],[data-sheet],[data-plan],[data-bundle],[data-scrollto],[data-login],[data-acc],[data-clear-search],[data-reset-search],[data-alias],[data-paidas],[data-adm]');
  if (!t) return;
  if (t.hasAttribute('data-clear-search') || t.hasAttribute('data-reset-search')) {
    state.q = '';
    if (t.hasAttribute('data-reset-search')) state.subject = 'all';
    render(); const qi = document.getElementById('q'); if (qi) qi.focus(); return;
  }
  if (t.dataset.go === 'custom') { go('customIntro'); return; }
  if (t.dataset.adm) { admAction(t.dataset.adm, t.dataset.id, t); return; }
  if (t.dataset.alias !== undefined) {
    const inp = document.getElementById('oName'); inp.value = aliasName(inp.value); t.textContent = '다른 가명';
    setErr('f-name', ''); return;
  }
  if (t.dataset.paidas !== undefined) { paidAsSheet(orders[Number(t.dataset.paidas)]); return; }
  if (t.dataset.go === 'checkout') { withLogin(() => go('checkout'), '로그인하면 바로 주문서로 이어져요.'); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.cfc !== undefined) {
    const cf = state.cf; cf.d[CSTEPS[cf.i].key] = t.dataset.cfc;
    if (CSTEPS[cf.i].key === 'files') cf.files = [];
    t.parentElement.querySelectorAll('.choice').forEach(b => b.classList.toggle('on', b === t));
    setTimeout(cfAdvance, 200); return;
  }
  if (t.dataset.login) {
    if (!FB_ON || !fbAuth) { toast('로그인을 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.'); return; }
    if (document.querySelector('[data-login][disabled]')) return;
    const login = t.dataset.login === 'kakao' ? kakaoLogin : t.dataset.login === 'twitter' ? twitterLogin : googleLogin;
    const buttons = Array.from(document.querySelectorAll('[data-login]'));
    buttons.forEach(b => { b.disabled = true; b.setAttribute('aria-busy', b === t ? 'true' : 'false'); });
    const status = document.getElementById('loginStatus');
    if (status) status.textContent = '로그인 창에서 계속해 주세요.';
    login().then(r => { const u = (r && r.user) || (fbAuth && fbAuth.currentUser); if (!u) return; const resumed = resumeAfterLogin(); setTimeout(() => invitePromo(u), resumed ? 1600 : 350); }).catch(() => {}).finally(() => {
      buttons.forEach(b => { b.disabled = false; b.removeAttribute('aria-busy'); });
      if (status && status.isConnected) status.textContent = '';
    }); return;
  }
  if (t.dataset.acc) {
    const a = t.dataset.acc;
    if (a === 'mail') { AUTH.mail = AUTH.mail === false; if (FB_ON) fbDb.collection('users').doc(AUTH.uid).update({mail: AUTH.mail}).catch(() => {}); else saveAuth(); render(); return; }
    if (a === 'help') { toast(`${SHOP.email}로 주문번호와 함께 보내 주세요.`); return; }
    if (a === 'logout') { openSheet('로그아웃할까요?', '다시 로그인하면 주문 내역과 혜택은 그대로 있어요.', '로그아웃', () => { if (FB_ON) { fbAuth.signOut(); toast('로그아웃했어요.'); return; } AUTH = {}; saveAuth(); render(); toast('로그아웃했어요.'); }); document.getElementById('shOk').className = 'btn ink'; return; }
    if (a === 'leave') { openSheet('정말 탈퇴하시겠어요?', '탈퇴하면 받은 시험지, 무료 답지, 할인 혜택이 모두 사라지고 되돌릴 수 없어요.', '탈퇴할게요', () => { if (FB_ON) { leaveAccount(); return; } AUTH = {}; saveAuth(); render(); toast('탈퇴 처리됐어요.'); }); document.getElementById('shOk').className = 'btn danger'; return; }
  }
  if (t.dataset.scrollto) { const el = document.getElementById(t.dataset.scrollto); if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); return; }
  if (t.dataset.plan) { startCustom(); state.cf.d.plan = t.dataset.plan; state.cf.i = 1; render(); return; }
  if (t.dataset.bundle) {
    const code = t.dataset.bundle;
    withLogin(() => {
      if (!cart.some(it => it.bundle === code)) {
        cart = cart.filter(it => !(it.pid && prod(it.pid).code === code));
        cart.push({bundle:code}); saveCart();
      }
      render(); toast('묶음을 장바구니에 담았습니다.');
    }, '로그인하면 바로 장바구니에 담겨요.'); return;
  }
  if (t.dataset.sheet) {
    if (t.dataset.sheet === 'ok' && sheetFn) { const fn = sheetFn; closeSheet(); fn(); } else closeSheet();
    return;
  }
  if (t.dataset.cancel !== undefined) {
    const o = orders[Number(t.dataset.cancel)]; if (!o) return;
    const paid = o.kind === 'order' ? o.stage >= 1 : o.stage >= 2;
    const body = (o.kind === 'order' ? 'PDF를 받은 이후엔 환불이 불가능해요.' : '제작이 시작된 이후엔 환불이 불가능해요.')
      + (paid ? ' 지금 취소하면 입금하신 금액을 돌려드려요.' : ' 아직 입금 전이라 바로 취소돼요.');
    document.getElementById('shOk').className = 'btn danger';
    openSheet(o.kind === 'order' ? '정말 주문을 취소하시겠어요?' : '정말 신청을 취소하시겠어요?', body, '취소할게요', () => {
      cancelRecord(o).then(() => { render(); toast('취소되었어요.'); }).catch(() => toast('취소하지 못했어요. 다시 시도해 주세요.'));
    });
    return;
  }
  if (t.dataset.rmfile !== undefined) {
    const fs = state.cf.files; const f = fs[Number(t.dataset.rmfile)];
    if (f && f.url) { try { URL.revokeObjectURL(f.url); } catch(_) {} }
    fs.splice(Number(t.dataset.rmfile), 1);
    if (!fs.length && state.cf.d.files && state.cf.d.files.startsWith('시험지')) delete state.cf.d.files;
    render(); return;
  }
  if (t.dataset.tog) {
    const [kind, val] = t.dataset.tog.split('|'); const arr = state.cf.pick[kind];
    const i = arr.indexOf(val); if (i >= 0) arr.splice(i, 1); else arr.push(val);

  if (t.dataset.cfq !== undefined && state.cf && CSTEPS[state.cf.i] && CSTEPS[state.cf.i].key === 'school') { state.cf.d.schoolInfo = {}; }
  if (t.dataset.school && state.cf) { try { state.cf.d.schoolInfo = JSON.parse(t.dataset.school); } catch(_) {} }
  if (t.dataset.cfq !== undefined) { state.cf.d[CSTEPS[state.cf.i].key] = t.dataset.cfq; cfAdvance(); return; }
  if (t.dataset.cfedit !== undefined) { const cf = state.cf; cf.returnTo = cf.i; cf.i = Number(t.dataset.cfedit); cf.editing = true; cf.rangePick = false; cf.dir = 'back'; render(); window.scrollTo(0,0); return; }
  if (t.dataset.cf) {
    if (t.dataset.cf === 'start') { startCustom(); return; }
    const cf = state.cf; const act = t.dataset.cf;
    if (act === 'back') {
      cf.dir = 'back';
      if (cf.rangePick) { cf.rangePick = false; render(); return; }
      if (cf.upPick) { cf.upPick = false; render(); return; }
      if (cf.editing) { cf.i = cf.returnTo ?? CSTEPS.length; cf.editing = false; }
      else if (cf.i === 0) { go('customIntro'); return; }
      else cf.i--;
      render(); window.scrollTo(0,0); return;
    }
    if (act === 'rangePick') { cf.rangePick = true; cf.pick = cf.pick || {u:[], m:[]}; cf.dir = 'fwd'; render(); window.scrollTo(0,0); return; }
    if (act === 'pickDone') {
      const p = cf.pick; cf.d.range = [p.u.join(', '), p.m.join(', ')].filter(Boolean).join(' / ');
      cf.rangePick = false; cfAdvance(); return;
    }
    if (act === 'upPick') { cf.upPick = true; cf.dir = 'fwd'; render(); window.scrollTo(0,0); return; }

      cf.d[st.key] = v; cfAdvance(); return;

      withLogin(async () => {
        const d = cf.d;
        try { localStorage.setItem('fx-cf', JSON.stringify({school:d.school, email:d.email})); } catch(_) {}
        state.custom = Object.assign({no:`C-${code4()}`}, d, {total: tfPrice(d)});
        const rec = {kind:'custom', no:state.custom.no, title:`THEFACTORIAL ${d.plan.split(' ')[0]} · ${d.subject}`, stage:0, cancelled:false,
          total:tfPrice(d), coupon: tfCouponOk(d), email:d.email, answers:Object.assign({}, d, cf.exam ? {examName: cf.exam.name, examDate: ymd(cf.exam.date)} : {}), fileNames:cf.files.map(f => f.name)};
        try { await saveRecord(rec); } catch(err) { toast('신청을 저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.'); return; }
        go('customDone');
      });
      return;
    }
  }
  if (t.dataset.pid) { go('detail', {pid:t.dataset.pid}); return; }
  if (t.dataset.subject) { state.subject = t.dataset.subject; render(); return; }
  if (t.dataset.add) {
    const pid = t.dataset.add;
    withLogin(() => {
      if (cart.some(it => it.bundle === prod(pid).code)) { toast('이미 담은 묶음에 들어 있어요.'); return; }
      if (!inCart(pid)) { cart.push({pid}); saveCart(); }
      render(); toast('장바구니에 담았습니다.');
    }, '로그인하면 바로 장바구니에 담겨요.'); return;
  }
  if (t.dataset.free) { const fp = prod(t.dataset.free); withLogin(() => downloadPaper(fp), '로그인하면 바로 받을 수 있어요.'); return; }
  if (t.dataset.del) { cart.splice(Number(t.dataset.del), 1); saveCart(); render(); return; }
  if (t.dataset.toss) { openToss(t.dataset.toss, t.dataset.dep); return; }
  if (t.dataset.share) { const sp = prod(t.dataset.share); if (sp) sharePaper(sp); return; }
  if (t.dataset.copy) {
    const v = t.dataset.copy;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v).then(() => toast('복사했습니다.'), () => toast(`복사가 안 됩니다. 직접 적어 주세요: ${v}`));
    } else toast(`직접 적어 주세요: ${v}`);
  }
});

function kbOffset(){
  const vv = window.visualViewport; if (!vv) return;
  const off = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty('--kb', off + 'px');
}
if (window.visualViewport) { visualViewport.addEventListener('resize', kbOffset); visualViewport.addEventListener('scroll', kbOffset); }

/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCG41zwm7Rm-ugRz6gcTKdfADPEyKJDXjQ",
  authDomain: "thefactorial.web.app",
  projectId: "factorial-e1571",
  storageBucket: "factorial-e1571.firebasestorage.app",
  messagingSenderId: "109452600202",
  appId: "1:109452600202:web:690108cbcbf4967bc41e73"
};
const FB_ON = typeof firebase !== 'undefined';
let fbAuth = null, fbDb = null, unOrders = null, unUser = null;

/* 초대 링크: ?invite=코드 를 기억해 둠 */
try { if (new URLSearchParams(location.search).has('admin')) state.view = 'admin'; } catch(_) {}
try { const dp = new URLSearchParams(location.search).get('p'); if (dp && PRODUCTS.some(x => x.id === dp)) { state.view = 'detail'; state.pid = dp; } } catch(_) {}
try { const inv = new URLSearchParams(location.search).get('invite'); if (inv && !pendingInvite()) localStorage.setItem('fx-invite', JSON.stringify({c: inv.replace(/[^A-Z0-9]/gi, '').slice(0, 12), t: Date.now()})); } catch(_) {}
function pendingInvite(){
  try { const v = JSON.parse(localStorage.getItem('fx-invite') || 'null'); if (v && v.c && Date.now() - v.t < 7 * 864e5) return v.c; } catch(_) {}
  return null;
}

function softRender(){ if (['cart','account','home','admin'].includes(state.view)) render(); else updateChrome(); }
function inApp(){ return /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|everytimeApp|DaumApps/i.test(navigator.userAgent); }
function inAppGuide(){
  if (/KAKAOTALK/i.test(navigator.userAgent)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); return; }
  document.getElementById('shOk').className = 'btn ink';
  openSheet('다른 브라우저에서 열어 주세요', '카페나 SNS 앱 안에서는 구글 로그인이 막혀 있어요. 오른쪽 위 메뉴에서 "다른 브라우저로 열기"를 누르거나 주소를 복사해 크롬이나 사파리에서 열어 주세요.', '주소 복사', () => {
    try { navigator.clipboard.writeText(location.href).then(() => toast('주소를 복사했어요.')); } catch(_) { toast(location.href); }
  });
}
function googleLogin(){
  if (!FB_ON) return Promise.resolve(null);
  if (inApp()) { inAppGuide(); return Promise.reject(new Error('inapp')); }
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:'select_account'});
  return fbAuth.signInWithPopup(p).catch(err => {
    const c = err && err.code;
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') throw err;
    const msg = {'auth/unauthorized-domain':'이 주소는 아직 로그인이 허용되지 않았어요.', 'auth/operation-not-allowed':'구글 로그인이 아직 켜져 있지 않아요.', 'auth/popup-blocked':'팝업이 막혔어요. 팝업을 허용한 뒤 다시 눌러 주세요.', 'auth/network-request-failed':'인터넷 연결을 확인해 주세요.'}[c];
    toast((msg || '로그인하지 못했어요. 다시 시도해 주세요.') + (c ? ` (${c.replace('auth/', '')})` : ''));
    console.error('login error', err);
    throw err;
  });
}
function twitterLogin(){
  if (!FB_ON) return Promise.resolve(null);
  return fbAuth.signInWithPopup(new firebase.auth.TwitterAuthProvider()).catch(err => {
    const code = err && err.code;
    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') throw err;
    const messages = {
      'auth/account-exists-with-different-credential': '같은 이메일로 가입한 계정이 있어요. 기존 로그인 방법을 사용해 주세요.',
      'auth/operation-not-allowed': 'X 로그인을 준비 중이에요.',
      'auth/popup-blocked': '팝업을 허용한 후 다시 시도해 주세요.',
      'auth/network-request-failed': '인터넷 연결을 확인해 주세요.'
    };
    toast(messages[code] || 'X 로그인에 실패했어요. 다시 시도해 주세요.');
    console.error('X login error', err);
    throw err;
  });
}
function kakaoLogin(){
  if (!FB_ON) return Promise.resolve(null);
  const provider = new firebase.auth.OAuthProvider('oidc.kakao');
  provider.addScope('openid');
  provider.addScope('profile_nickname');
  return fbAuth.signInWithPopup(provider).then(async result => {
    const profile = result.additionalUserInfo && result.additionalUserInfo.profile;
    const nickname = profile && typeof profile.nickname === 'string' ? profile.nickname.trim().slice(0, 80) : '';
    if (nickname && result.user) {
      try {
        await result.user.updateProfile({displayName: nickname});
        await ensureUser(result.user);
        await fbDb.collection('users').doc(result.user.uid).update({name: nickname});
        if (fbAuth.currentUser && fbAuth.currentUser.uid === result.user.uid) {
          AUTH.name = nickname;
          softRender();
        }
      } catch (error) { console.warn('카카오 프로필 저장 실패', error); }
    }
    return result;
  }).catch(err => {
    if (err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request')) throw err;
    toast('카카오 로그인에 실패했어요. 다시 시도해 주세요.');
    console.error('kakao login error', err);
    throw err;
  });
}
/* 로그인이 필요한 동작: 로그인 방법을 선택하도록 안내 */

/* 로그인이 필요한 동작: 로그인 화면으로 보냈다가, 로그인되면 원래 화면으로 돌아와 이어서 실행 */
function withLogin(fn, msg){
  if (!FB_ON || (fbAuth && fbAuth.currentUser)) { fn(); return; }
  pendingLogin = {fn, view: state.view, pid: state.pid};
  go('account');
  toast(msg || '로그인하면 이어서 진행돼요.');
}
function resumeAfterLogin(){
  const p = pendingLogin;
  if (!p) return false;
  go(p.view, {pid: p.pid});
  try { p.fn(); } catch(err) { console.error(err); }
  return true;
}
async function saveRecord(rec){
  if (!FB_ON) { orders.push(rec); saveOrders(); return; }
  const u = fbAuth.currentUser;
  const ref = await fbDb.collection('orders').add(Object.assign(rec, {uid:u.uid, account:u.email, createdAt: firebase.firestore.FieldValue.serverTimestamp()}));
  notifySheet('new', ref.id);
}
async function cancelRecord(o){
  if (!FB_ON || !o.id) { o.cancelled = true; saveOrders(); return; }
  await fbDb.collection('orders').doc(o.id).update({cancelled:true, cancelledAt: firebase.firestore.FieldValue.serverTimestamp()});
  notifySheet('cancel', o.id);
}
async function leaveAccount(){
  const u = fbAuth.currentUser; if (!u) return;
  try {
    await fbDb.collection('users').doc(u.uid).delete().catch(() => {});
    await u.delete();
    toast('탈퇴 처리됐어요.');
  } catch(err) {
    if (err && err.code === 'auth/requires-recent-login') toast('보안을 위해 다시 로그인한 뒤 탈퇴해 주세요.');
    else toast('탈퇴하지 못했어요. 문의해 주세요.');
  }
}
async function ensureUser(u){
  const ref = fbDb.collection('users').doc(u.uid);
  const snap = await ref.get();
  if (!snap.exists) {
    const invitedBy = pendingInvite();
    await ref.set({email:u.email, name:u.displayName || '', inviteCode: inviteCode(u.email || u.uid), invitedBy: invitedBy || null,
      freeKeys:0, invited:0, mail:true, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    if (invitedBy) { notifySheet('invite', u.uid); setTimeout(() => toast('친구 초대 혜택이 들어왔어요: 무료 답지 1장 + THEFACTORIAL 30% 쿠폰'), 4000); }
  }
}
if (FB_ON) {
  firebase.initializeApp(firebaseConfig);
  fbAuth = firebase.auth(); fbDb = firebase.firestore();
  orders = [];
  fbAuth.onAuthStateChanged(async u => {
    if (unOrders) { unOrders(); unOrders = null; }
    if (unUser) { unUser(); unUser = null; }
    if (!u) { AUTH = {}; orders = []; softRender(); return; }
    AUTH = {uid:u.uid, email:u.email, name:u.displayName || ''};
    try { await ensureUser(u); } catch(_) {}
    fbDb.collection('admins').doc(u.uid).get().then(d => { AUTH.admin = d.exists; softRender(); }, () => {});
    unUser = fbDb.collection('users').doc(u.uid).onSnapshot(d => { if (d.exists) { Object.assign(AUTH, d.data(), {uid:u.uid, email:u.email}); softRender(); } }, () => {});
    unOrders = fbDb.collection('orders').where('uid', '==', u.uid).onSnapshot(q => {
      orders = q.docs.map(d => Object.assign({id:d.id}, d.data()))
        .sort((a, b) => ((a.createdAt && a.createdAt.seconds) || 0) - ((b.createdAt && b.createdAt.seconds) || 0));
      softRender();
    }, () => {});
    softRender();
  });
}

render();
