<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<title>팩토리얼 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  /* layout: 480px 모바일 단일 컬럼. 흰 종이 위 먹색 글씨, 대표색 파랑(#2d7ce3) 하나. 떠 있는 요소만 유리 재질 */
  --bg:#edf2f9;
  --card:#ffffff;
  --ink:#1a1f2e;
  --muted:#647089;
  --line:#dfe6f0;
  --soft:#e8eef7;
  --red:#2d7ce3;
  --err:#d2342b;
  --frame:#d5deeb;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
@media (min-width:520px){body{background:var(--frame)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:112px}
@media (min-width:520px){.shell{box-shadow:0 0 0 1px var(--line)}}

/* liquid glass: 떠 있는 요소 전용 */
.glass{
  position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.22));
  -webkit-backdrop-filter:blur(16px) saturate(210%) brightness(1.06);
  backdrop-filter:blur(16px) saturate(210%) brightness(1.06);
  border:0;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.95),
    inset 0 -1px 2px rgba(255,255,255,.45),
    inset 0 0 12px rgba(255,255,255,.25),
    0 14px 34px rgba(26,31,46,.16),
    0 2px 6px rgba(26,31,46,.08);
}
/* 위쪽 반사광 */
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.08) 38%,rgba(255,255,255,0) 60%);
}
/* 가장자리 굴절 테두리 */
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,1),rgba(255,255,255,.15) 35%,rgba(255,255,255,.05) 60%,rgba(255,255,255,.75));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
.glass > *:not(.lens){position:relative;z-index:1}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:rgba(255,255,255,.96)}
}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;border-radius:0;box-shadow:inset 0 -1px 0 rgba(26,31,46,.06),0 6px 20px rgba(26,31,46,.06)}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-weight:700;font-size:17px;letter-spacing:-.02em}
.mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:var(--ink);color:#fff;font-family:var(--serif);font-weight:800;font-size:14px}
.mark b{color:#8fbaf3}
.icon-btn{position:relative;width:42px;height:42px;display:grid;place-items:center;background:none;border:0;border-radius:21px}
.badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.badge[hidden]{display:none}

/* home */
.search{margin:14px 16px 0;position:relative}
.search input{width:100%;height:46px;padding:0 14px 0 42px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:15px}
.search svg{position:absolute;left:14px;top:14px;color:var(--muted)}
.label{padding:20px 16px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:16px 16px 0}
.subj{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;min-height:58px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);text-align:left}
.subj .n{font-weight:600;font-size:14.5px;line-height:1.3;word-break:keep-all}
.subj .k{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.subj[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.subj[aria-pressed="true"] .k{color:#b7bccb}
.list-head{display:flex;align-items:baseline;gap:6px;padding:22px 16px 8px}
.list-head h2{font-size:17px;font-weight:700}
.list-head span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.list{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:58px 1fr 16px;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:active{background:var(--soft)}
.info{min-width:0;display:flex;flex-direction:column;gap:2px}
.title{font-weight:600;font-size:16px;line-height:1.35}
.new{font-size:11px;font-weight:600;color:var(--red);margin-left:4px;vertical-align:2px}
.sub{font-size:13px;color:var(--muted)}
.prices{font-size:14px;font-variant-numeric:tabular-nums;margin-top:3px}
.prices .f{color:var(--muted)}
.prices b{font-weight:700}
.chev{color:#b0b3be}
.empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:14px}
.custom-link{display:flex;align-items:center;justify-content:space-between;gap:12px;width:calc(100% - 32px);margin:16px 16px 0;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);text-align:left}
.custom-link b{display:block;font-size:15px}
.custom-link span{font-size:13px;color:var(--muted)}

/* thumbnail */
.thumb{position:relative;width:58px;aspect-ratio:257/364;background:#fff;border:1px solid #cfd0d6;padding:5px 4px;font-family:var(--serif);overflow:hidden}
.thumb .t1{font-size:4.5px;color:var(--muted);text-align:center}
.thumb .t2{font-size:8px;font-weight:800;text-align:center;line-height:1.2;margin-top:2px;border-bottom:1px solid var(--ink);padding-bottom:3px;word-break:keep-all}
.thumb .lines{position:absolute;left:4px;right:4px;top:28px;bottom:5px;background:repeating-linear-gradient(to bottom,#dcdde2 0 1.5px,transparent 1.5px 5.5px);-webkit-mask:linear-gradient(90deg,#000 45%,transparent 45% 55%,#000 55%);mask:linear-gradient(90deg,#000 45%,transparent 45% 55%,#000 55%)}
.thumb .rnd{position:absolute;right:3px;bottom:4px;min-width:20px;height:20px;padding:0 3px;background:#fff;border:1px solid var(--ink);color:var(--ink);font-family:var(--sans);font-size:10px;font-weight:700;display:grid;place-items:center}
.thumb.premium{background:var(--ink);border-color:var(--ink)}
.thumb.premium .t1{color:#9aa0b2}
.thumb.premium .t2{color:#fff;border-color:#fff}
.thumb.premium .lines{background:repeating-linear-gradient(to bottom,#3a4157 0 1.5px,transparent 1.5px 5.5px)}
.thumb.premium .rnd{background:var(--ink);border-color:#fff;color:#fff}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{height:36px;padding:0 14px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* detail */
.backlink{display:flex;align-items:center;gap:4px;background:none;border:0;padding:12px 12px 4px;font-size:14px;color:var(--muted)}
.preview-wrap{padding:10px 16px 18px}
.sheet{position:relative;width:100%;aspect-ratio:257/364;background:#fff;border:1px solid #cfd0d6;padding:5% 5.5%;font-family:var(--serif);overflow:hidden;font-size:clamp(9px,2.7vw,12.5px);line-height:1.6}
.sh-top{display:flex;justify-content:space-between;font-size:.85em;color:var(--muted)}
.sh-title{text-align:center;font-weight:800;font-size:2em;letter-spacing:.15em;margin:.3em 0 .2em;word-break:keep-all}
.sh-row{display:flex;justify-content:space-between;gap:8px;font-size:.82em;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:.35em 0}
.sh-body{display:grid;grid-template-columns:1fr 1fr;gap:6%;margin-top:1em;position:relative}
.sh-body::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #c9cad1}
.q{margin-bottom:1.2em}
.q p{margin:0 0 .5em;font-weight:700}
.q .pts{font-weight:400;color:var(--muted)}
.box{border:1px solid #9a9eab;padding:.5em;margin-bottom:.5em}
.ln{height:.42em;margin:.42em 0;background:#e3e4e9;border-radius:2px}
.opt{display:flex;gap:.4em;align-items:center;margin:.25em 0}
.opt .ln{flex:1;margin:0}
.veil{position:absolute;left:0;right:0;bottom:0;height:58%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9%;background:linear-gradient(to bottom,rgba(255,255,255,0) 0%,rgba(255,255,255,.93) 30%,#fff 60%);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);-webkit-mask:linear-gradient(to bottom,transparent,#000 22%);mask:linear-gradient(to bottom,transparent,#000 22%)}
.veil span{font-family:var(--sans);font-size:13px;color:var(--muted)}
.d-head{padding:18px 16px 6px;background:var(--card);border-top:1px solid var(--line)}
.d-head h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.d-head .pricebig{margin-top:6px;font-size:15px;font-variant-numeric:tabular-nums}
.d-head .pricebig .f{color:var(--muted)}
.spec{margin:0;padding:10px 16px 18px;background:var(--card);display:grid;grid-template-columns:76px 1fr;gap:8px 12px;font-size:14px;border-bottom:1px solid var(--line)}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-variant-numeric:tabular-nums}
.includes{margin-top:10px;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px}
.includes h2{font-size:15px;font-weight:700;margin-bottom:8px}
.inc{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.inc:first-of-type{border-top:0}
.inc .ds{color:var(--muted);font-size:13px}
.inc b{font-variant-numeric:tabular-nums;white-space:nowrap}
.note{padding:14px 16px;font-size:12.5px;color:var(--muted);line-height:1.6}

/* forms */
.panel{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:14px;margin-top:10px}
.panel h2{font-size:16px;font-weight:700}
.page-title{padding:20px 16px 4px}
.page-title h1{font-size:21px;font-weight:700}
.page-title p{margin:6px 0 0;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lb{font-size:13.5px;font-weight:600}
.field label em{font-style:normal;color:var(--red)}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.field textarea{min-height:96px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--err)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--err)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--red);flex:none}
.seg{display:flex;gap:6px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:grid;place-items:center;height:44px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-weight:500;text-align:center;padding:0 4px}
.seg input:checked+span{border-color:var(--ink);background:var(--ink);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}

/* cart */
.c-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.c-item .nm{font-weight:600;font-size:14.5px}
.c-item .ds{font-size:12.5px;color:var(--muted)}
.c-item .rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-weight:700;font-variant-numeric:tabular-nums}
.link{background:none;border:0;padding:2px 0;font-size:12.5px;color:var(--muted);text-decoration:underline}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.total b{font-size:21px;font-variant-numeric:tabular-nums}

/* done */
.done-head{padding:28px 16px 10px}
.done-head h1{font-size:21px;font-weight:700}
.done-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.kvs{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums;word-break:keep-all}
.kv .v.big{font-size:18px;font-weight:700;color:var(--red)}
.kv .v small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.howto{padding:18px 16px 0;font-size:14px;line-height:1.7}
.howto h2{font-size:15px;font-weight:700;margin-bottom:6px}
.howto ol{margin:0;padding-left:20px}

/* 주문제작: 한 화면에 질문 하나 */
.flow-top{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 0}
.back-ic{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:22px}
.back-ic:active{background:var(--soft)}
.stepno{font-size:13px;color:var(--muted);padding-right:12px;font-variant-numeric:tabular-nums}
.progress{height:3px;margin:2px 20px 0;background:var(--soft);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--red);border-radius:2px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.step{padding:0 20px 140px;animation:stepIn .32s cubic-bezier(.2,.8,.2,1)}
.step.rev{animation-name:stepBack}
@keyframes stepIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes stepBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.ask{font-size:25px;font-weight:700;line-height:1.38;letter-spacing:-.025em;margin:30px 0 26px}
.big-input{width:100%;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;font-size:22px;font-weight:600;padding:8px 0 10px;transition:border-color .2s}
.big-input:focus{outline:none;border-bottom-color:var(--red)}
.big-input::placeholder{color:#b9bcc6;font-weight:500}
textarea.big-input{font-size:18px;line-height:1.5;min-height:112px;resize:none}
.in-err{margin-top:8px;font-size:13px;color:var(--err);min-height:18px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:8px;word-break:keep-all;height:62px;padding:0 20px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-size:17px;font-weight:600;text-align:left;transition:transform .12s,border-color .15s,background .15s,color .15s}
.choice:active{transform:scale(.98)}
.choice.on{border-color:var(--red);background:#eaf2fd;color:var(--red)}
.choice svg{opacity:0;transition:opacity .15s}
.choice.on svg{opacity:1}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.qchip{height:40px;padding:0 16px;border-radius:20px;border:0;background:#e6eefa;color:var(--red);font-size:14.5px;font-weight:600;transition:transform .12s}
.qchip:active{transform:scale(.96)}
.rv{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;padding:15px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:15.5px}
.rv .k{color:var(--muted);font-size:14px}
.rv .v{font-weight:600;word-break:keep-all;white-space:pre-line}
.rv .e{font-size:13px;color:var(--red);font-weight:600}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--kb,0px) + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:456px;z-index:35;padding:8px;border-radius:22px;transition:bottom .2s}
.cta .btn{width:100%;height:56px;border-radius:16px;font-size:17px;transition:opacity .2s,background .2s}
.cta .btn:disabled{opacity:1;background:#b8d0f2;border-color:#b8d0f2}
@media (prefers-reduced-motion:reduce){.step{animation:none}.progress i,.choice,.cta{transition:none}}

.sug{display:flex;flex-direction:column;margin-top:6px}
.sug button{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:17px;font-weight:600}
.sug button:active{background:var(--soft)}
.sug mark{background:none;color:var(--red)}
.sug small{font-size:13px;font-weight:400;color:var(--muted);white-space:nowrap}
.mail{font-size:21px;font-weight:700;color:var(--red);word-break:break-all;margin:-6px 0 26px}
.choice.sub2{background:var(--soft);border-color:transparent;color:var(--ink)}

.choices.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices.grid .choice{height:56px;padding:0 16px;font-size:16px}
.choices.grid .choice.wide{grid-column:1/-1}
.pick-h{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 10px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.tg{height:44px;min-width:64px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:600;transition:transform .12s,background .15s,border-color .15s,color .15s}
.tg:active{transform:scale(.95)}
.tg.on{background:var(--red);border-color:var(--red);color:#fff}

/* 주문제작 소개 */
.intro{padding:34px 20px 0;animation:stepIn .32s cubic-bezier(.2,.8,.2,1)}
.fan{position:relative;height:150px;display:flex;justify-content:center;align-items:flex-end;margin-bottom:26px}
.fan .thumb{position:absolute;bottom:0;width:86px;box-shadow:0 8px 20px rgba(26,31,46,.12)}
.fan .thumb:nth-child(1){transform:translateX(-62px) rotate(-10deg)}
.fan .thumb:nth-child(2){transform:translateY(-10px);z-index:2}
.fan .thumb:nth-child(3){transform:translateX(62px) rotate(10deg)}
.fan .thumb .t1{font-size:6px}.fan .thumb .t2{font-size:11px}.fan .thumb .lines{top:38px}
.intro h1{font-size:26px;font-weight:700;line-height:1.38;letter-spacing:-.025em}
.intro .lead{margin:10px 0 26px;color:var(--muted);font-size:15.5px}
.feat{display:flex;flex-direction:column;background:var(--card);border-radius:18px;padding:4px 18px;box-shadow:0 1px 3px rgba(26,31,46,.06)}
.feat div{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:15px 0;border-bottom:1px solid var(--line)}
.feat div:last-child{border-bottom:0}
.feat svg{color:var(--red);margin-top:2px}
.feat b{display:block;font-size:15.5px}
.feat span{font-size:13.5px;color:var(--muted)}
.intro .start{margin-top:22px;height:56px;border-radius:16px;font-size:17px;box-shadow:0 6px 16px rgba(45,124,227,.28)}
.intro .fine{text-align:center;font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* 완료 화면 */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 20px 150px}
.ok svg{width:96px;height:96px;overflow:visible;display:block}
.ok .disc{fill:var(--red);transform-origin:44px 44px;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.ok .ring{fill:none;stroke:var(--red);stroke-width:2;transform-origin:44px 44px;animation:ripple .9s .3s ease-out both}
.ok .tick{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .38s .4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ripple{from{transform:scale(1);opacity:.55}to{transform:scale(1.7);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.done-t{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:26px;animation:rise .45s .55s both}
.done-s{margin:8px 0 0;color:var(--muted);font-size:15px;animation:rise .45s .62s both}
.sum{width:100%;margin-top:32px;background:var(--card);border-radius:18px;padding:4px 18px;text-align:left;animation:rise .45s .7s both;box-shadow:0 1px 3px rgba(26,31,46,.06)}
.sum .r{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum .r:last-child{border-bottom:0}
.sum .k{color:var(--muted);font-size:14px}
.sum .v{font-weight:600;word-break:keep-all}
.sum .v.big{font-size:19px;font-weight:700;color:var(--red)}
.sum .v small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.done-n{margin-top:16px;font-size:13.5px;color:var(--muted);line-height:1.6;animation:rise .45s .78s both}
@media (prefers-reduced-motion:reduce){.ok .disc,.ok .ring,.done-t,.done-s,.sum,.done-n{animation:none}.ok .ring{opacity:0}.ok .tick{animation:none;stroke-dashoffset:0}}

/* footer */
.foot{margin-top:28px;padding:22px 16px 26px;font-size:12px;color:var(--muted);line-height:1.75;border-top:1px solid var(--line)}
.foot strong{color:var(--ink);font-size:13px}
.foot p{margin:10px 0 0}

/* floating: bottom nav (glass capsule + 움직이는 렌즈) */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 40px);max-width:400px;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:32px}
.nav .lens{position:absolute;z-index:0;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 4);border-radius:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.4));
  box-shadow:inset 0 1px 1px #fff,inset 0 -2px 5px rgba(45,124,227,.08),0 4px 14px rgba(45,124,227,.18),0 1px 2px rgba(26,31,46,.08);
  transition:transform .5s cubic-bezier(.3,1.35,.45,1),opacity .2s}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;border-radius:26px;font-size:11.5px;font-weight:600;color:#565c6c;transition:color .25s,transform .15s}
.nav button:active{transform:scale(.92)}
.nav button[aria-current="page"]{color:var(--red)}
.nav .badge{top:2px;right:calc(50% - 24px)}
.nav[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.nav .lens{transition:none}}

/* floating: buy bar on detail (glass) */
.buybar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:420px;z-index:30;display:flex;gap:8px;padding:8px;border-radius:20px}
.buybar .btn{flex:1;height:50px;border-radius:14px}
.buybar .btn.ghost{background:rgba(255,255,255,.55);border-color:transparent;box-shadow:inset 0 1px 1px #fff,0 1px 3px rgba(26,31,46,.08)}
.buybar .btn.primary,.cta .btn.primary{box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 6px 16px rgba(45,124,227,.3)}
.buybar[hidden]{display:none}

/* floating: toast (dark glass) */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,10px);max-width:420px;width:calc(100% - 32px);padding:12px 16px;border-radius:16px;font-size:14px;color:#fff;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;
  background:linear-gradient(180deg,rgba(40,46,64,.78),rgba(26,31,46,.72));
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(26,31,46,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ===== 유체적 · 입체적 UI ===== */
:root{
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  --grad:linear-gradient(180deg,#4b94f1 0%,#2d7ce3 55%,#2467c8 100%);
  --lift:0 1px 1px rgba(26,31,46,.04),0 4px 10px rgba(26,31,46,.05),0 14px 28px rgba(26,31,46,.06);
}
.ask{font-size:25px;line-height:1.4;margin:26px 0 24px;display:flex;gap:8px;letter-spacing:-.03em}
.qno{color:var(--red);flex:none}
.page-title h1,.list-head h2,.sec-h{letter-spacing:-.02em}

/* 진행 막대: 스프링으로 늘어나고 빛이 흐름 */
.progress{height:6px;margin:4px 20px 0;background:#e5e7ed;border-radius:3px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(26,31,46,.08)}
.progress i{position:relative;display:block;height:100%;background:var(--grad);border-radius:3px;transition:width .7s var(--spring);box-shadow:0 0 10px rgba(45,124,227,.5);overflow:hidden}
.progress i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:sheen 1.8s ease-in-out infinite}
@keyframes sheen{to{transform:translateX(100%)}}

/* 화면 전환: 탄성 있게 */
.step,.intro{animation:stepIn .55s var(--spring)}
.step.rev{animation-name:stepBack}
@keyframes stepIn{from{opacity:0;transform:translateX(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes stepBack{from{opacity:0;transform:translateX(-40px) scale(.98)}to{opacity:1;transform:none}}
.choices > *,.toggles > *{animation:rise .5s var(--spring) both}
.choices > *:nth-child(2),.toggles > *:nth-child(2){animation-delay:0.04s}
.choices > *:nth-child(3),.toggles > *:nth-child(3){animation-delay:0.08s}
.choices > *:nth-child(4),.toggles > *:nth-child(4){animation-delay:0.12s}
.choices > *:nth-child(5),.toggles > *:nth-child(5){animation-delay:0.16s}
.choices > *:nth-child(6),.toggles > *:nth-child(6){animation-delay:0.20s}
.choices > *:nth-child(7),.toggles > *:nth-child(7){animation-delay:0.24s}
.choices > *:nth-child(8),.toggles > *:nth-child(8){animation-delay:0.28s}
.choices > *:nth-child(9),.toggles > *:nth-child(9){animation-delay:0.32s}
.choices > *:nth-child(10),.toggles > *:nth-child(10){animation-delay:0.36s}

/* 선택지: 입체 카드 */
.choice{height:60px;border:0;border-radius:18px;justify-content:flex-start;gap:14px;padding:0 18px;font-size:17px;background:linear-gradient(180deg,#fff,#fafbfd);box-shadow:var(--lift),inset 0 1px 0 #fff;transition:transform .4s var(--spring),box-shadow .25s,background .25s,color .2s}
.choice:active{transform:scale(.96)}
.choice.on{color:var(--red);background:linear-gradient(180deg,#f5f9ff,#e8f0fd);box-shadow:0 0 0 2px var(--red),0 12px 26px rgba(45,124,227,.24);transform:translateY(-2px)}
.choice .ct{flex:1;min-width:0}
.choice .go{opacity:.4;flex:none}
.bub{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#8a8f9b;background:#eef0f4;box-shadow:inset 0 1px 2px rgba(26,31,46,.12);transition:background .2s,color .2s}
.choice.on .bub{background:var(--grad);color:#fff;box-shadow:0 3px 8px rgba(45,124,227,.45),inset 0 1px 0 rgba(255,255,255,.4);animation:pop2 .5s var(--spring)}
@keyframes pop2{from{transform:scale(.3)}to{transform:scale(1)}}
.choice.sub2{background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1.5px #d3d6de}
.choice.sub2.on{box-shadow:0 0 0 2px var(--red),0 12px 26px rgba(45,124,227,.24)}
.choices.grid .choice{height:56px;gap:10px;padding:0 14px;font-size:16px}
.choices.grid .bub{width:24px;height:24px;font-size:12px}
.tg{border:0;border-radius:14px;background:linear-gradient(180deg,#fff,#f8f9fb);box-shadow:var(--lift);transition:transform .4s var(--spring),background .2s,color .2s,box-shadow .2s}
.tg:active{transform:scale(.9)}
.tg.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(45,124,227,.38),inset 0 1px 0 rgba(255,255,255,.35);transform:translateY(-1px)}

/* 버튼 */
.btn{border-radius:14px;transition:transform .35s var(--spring),box-shadow .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(45,124,227,.3)}
.btn.primary:disabled,.cta .btn:disabled{background:#c6d9f4;box-shadow:none;opacity:1}
.cta .btn,.buybar .btn,.intro .start{border-radius:16px}

/* 카드: 떠 있는 종이 */
.sum,.feat,.trk{border:0;border-radius:20px;background:#fff;box-shadow:var(--lift)}
.panel{margin:10px 16px 0;border:0;border-radius:20px;box-shadow:var(--lift)}
.list{margin:0 16px;border:0;border-radius:20px;overflow:hidden;box-shadow:var(--lift)}
.list-head{padding:24px 18px 10px}
.list-head h2{font-size:19px}
.item{transition:background .2s}
.item:active{background:#f4f6fa}
.thumb{box-shadow:0 2px 6px rgba(26,31,46,.1);transition:transform .4s var(--spring)}
.item:active .thumb{transform:scale(.92) rotate(-2deg)}
.subj{border:0;border-radius:16px;min-height:62px;background:linear-gradient(180deg,#fff,#fafbfc);box-shadow:var(--lift);transition:transform .4s var(--spring),background .2s,color .2s,box-shadow .2s}
.subj:active{transform:scale(.93)}
.subj[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:0 10px 20px rgba(45,124,227,.35),inset 0 1px 0 rgba(255,255,255,.35);transform:translateY(-2px)}
.subj[aria-pressed="true"] .k{color:rgba(255,255,255,.85)}
.custom-link{border:0;border-radius:20px;box-shadow:var(--lift);transition:transform .4s var(--spring)}
.custom-link:active{transform:scale(.97)}
.page-title{padding:22px 18px 10px}
.page-title h1{font-size:23px}
.sec-h{font-size:18px;padding:22px 18px 10px;display:flex;align-items:baseline;gap:6px}
.sec-h span{font-weight:500;font-size:14px;color:var(--muted)}
.empty-paper{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.mail{font-weight:700}

/* 완료: 튀어나오는 원 + 체크 + 터지는 점 */
.ok{position:relative}
.ok svg{width:100px;height:100px}
.ok .disc{fill:url(#okg);filter:drop-shadow(0 10px 18px rgba(45,124,227,.4));animation:pop .6s var(--spring) both}
.ok .tick{stroke:#fff;stroke-width:6}
.ok .bp{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--red);opacity:0;animation:burst .75s .3s var(--ease) forwards}
.ok .bp:nth-child(even){width:6px;height:6px;margin:-3px;background:#8fbaf3}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateY(-34px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-82px) scale(.4)}}
@media (prefers-reduced-motion:reduce){.ok .bp{display:none}.progress i::after{animation:none}}

/* 진행 상황 */
.trks{display:flex;flex-direction:column;gap:12px;padding:0 16px}
.trk{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.trk .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.trk .t{font-weight:700;font-size:15px;word-break:keep-all}
.trk .no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.trk .msg{font-size:14px;color:var(--red);font-weight:600;margin-top:-6px}
.stepper{display:grid;grid-template-columns:repeat(var(--n),1fr)}
.stepper span{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);text-align:center;word-break:keep-all}
.stepper span::before{content:"";position:relative;z-index:1;width:12px;height:12px;border-radius:50%;background:#e2e4ea;box-shadow:inset 0 1px 2px rgba(26,31,46,.12)}
.stepper span::after{content:"";position:absolute;top:5px;left:50%;width:100%;height:3px;border-radius:2px;background:#e2e4ea}
.stepper span:last-child::after{display:none}
.stepper span.d::before{background:var(--grad);box-shadow:none}
.stepper span.d::after{background:var(--grad)}
.stepper span.c{color:var(--ink);font-weight:600}
.stepper span.c::before{background:var(--grad);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(45,124,227,.5)}100%{box-shadow:0 0 0 10px rgba(45,124,227,0)}}
.done-link{margin-top:14px;background:none;border:0;font-size:14px;font-weight:600;color:var(--red);text-decoration:underline;text-underline-offset:3px;animation:rise .45s .85s both}

/* 기출 시험지 올리기 */
.lead-s{margin:-10px 0 22px;color:var(--muted);font-size:15px;line-height:1.6}
.lead-s b{color:var(--ink)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;padding:18px;border:1.5px dashed #b5b9c4;border-radius:20px;background:var(--card);cursor:pointer;margin-bottom:10px;text-align:center;transition:transform .12s,border-color .15s}
.drop:active{transform:scale(.98);border-color:var(--red)}
.drop b{font-size:16.5px}
.drop span{font-size:13px;color:var(--muted)}
.drop svg{color:var(--red);margin-bottom:2px}
.files{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.fi{position:relative;aspect-ratio:257/364;border:0;box-shadow:var(--lift);background:var(--card);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;animation:mark .3s cubic-bezier(.3,1.4,.5,1)}
.fi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fi .pdf{font-family:var(--serif);font-weight:800;color:var(--red);font-size:16px}
.fi .nm{font-size:11px;color:var(--muted);word-break:break-all;text-align:center;line-height:1.3;max-height:2.6em;overflow:hidden}
.fi .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(26,31,46,.72);color:#fff;display:grid;place-items:center;z-index:2;font-size:16px;line-height:1}
.fi.add{border:1.5px dashed #9ca1ad;color:var(--red);font-weight:600;font-size:13px;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ===== 파란 종이 ===== */
.shell{background:
  repeating-linear-gradient(180deg,transparent 0 31px,rgba(45,124,227,.022) 31px 32px),
  var(--bg)}
/* 선지 가독성 */
.choice{color:var(--ink);font-weight:600}
.bub{background:#fff;color:#6f7890;box-shadow:inset 0 0 0 1.5px #b7c1d1;font-size:13px}
.choice.on{color:var(--ink)}
.choice.on .ct{color:var(--red)}

/* 영수증: 프린터에서 출력되듯 내려옴 */
.printer{width:100%;margin-top:30px;position:relative;text-align:left}
.slot{position:relative;z-index:2;height:12px;margin:0 -4px;border-radius:6px;background:linear-gradient(180deg,#323b52,#151a28);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 6px rgba(26,31,46,.22)}
.paperout{overflow:hidden;margin-top:-6px;padding:0 10px 26px;filter:drop-shadow(0 12px 14px rgba(26,40,70,.12))}
.rcpt{background:#f7faff;padding:24px 20px 34px;
  background-image:repeating-linear-gradient(180deg,transparent 0 27px,rgba(45,124,227,.025) 27px 28px);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;
  animation:print 1.2s .45s cubic-bezier(.3,.75,.25,1) both}
@keyframes print{from{transform:translateY(-102%)}to{transform:none}}
.rc-h{text-align:center}
.rc-h b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.rc-h span{display:block;margin-top:2px;font-size:13px;color:var(--red);font-weight:600}
.rc-m{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.rc-d{border-top:1.5px dashed #b7c6dc;margin:12px 0}
.rc-r{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:7px 0;font-size:15px}
.rc-r > span{color:var(--muted);flex:none}
.rc-r.it > span{flex:1;min-width:0;color:var(--ink)}
.rc-r.it b{flex:none;white-space:nowrap;font-family:var(--mono)}
.rc-r b{font-weight:600;text-align:right;word-break:keep-all;display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.rc-r small{display:block;font-weight:400;color:var(--muted);font-size:12px;width:100%;text-align:right}
.cp{height:28px;padding:0 10px;border-radius:8px;border:0;background:#e3edfb;color:var(--red);font-size:12.5px;font-weight:600}
.cp:active{transform:scale(.94)}
.rc-tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;font-weight:700}
.rc-tot b{font-family:var(--mono);font-size:22px;color:var(--red);font-weight:600}
.rc-bar{height:46px;margin-top:20px}
.rc-bar svg{width:100%;height:100%;display:block;fill:var(--ink)}
.rc-no{text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.28em;color:var(--muted);margin-top:6px}
.rc-f{text-align:center;font-size:13px;color:var(--muted);margin-top:12px;line-height:1.6}
@media (prefers-reduced-motion:reduce){.rcpt{animation:none}}
/* 실제 시험지 이미지 미리보기 */
.cv-paper.img,.sheet.img,.thumb.img{padding:0;background:#fff}
.cv-paper.img img,.sheet.img img,.thumb.img img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
.sheet.img .veil{height:46%}
/* 관리자 */
.am-pad{padding:8px 18px}
.am-head p{font-size:13.5px}
.am-tabs{display:flex;gap:6px;padding:4px 16px 10px;position:sticky;top:62px;z-index:5}
.am-tabs button{flex:1;height:42px;border:0;border-radius:12px;background:rgba(26,31,46,.05);font-size:14.5px;font-weight:600;color:var(--muted)}
.am-tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.am-tabs em{font-style:normal;margin-left:6px;font-family:var(--mono);font-size:13px;opacity:.8}
.am-list{display:grid;gap:10px;padding:0 16px 40px}
@media(min-width:700px){.am-list{grid-template-columns:1fr 1fr}}
.am-card{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--lift)}
.am-card.cx{opacity:.5}
.am-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.am-who b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;word-break:keep-all}
.am-who span{display:block;margin-top:2px;font-family:var(--mono);font-size:18px;font-weight:700;color:var(--red)}
.am-act{display:flex;gap:8px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end}
.am-v,.am-x{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:0}
.am-v{background:var(--red);color:#fff;box-shadow:0 6px 14px rgba(45,124,227,.32)}
.am-v:active{transform:scale(.94)}
.am-x{width:44px;height:44px;background:rgba(26,31,46,.06);color:var(--muted)}
.am-btn{height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--red);color:#fff;font-size:14px;font-weight:600}
.am-mini{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px 0}
.am-send{display:flex;gap:6px;width:100%}
.am-link{flex:1;min-width:0;height:44px;padding:0 12px;border:1.5px solid #c9d6ea;border-radius:12px;font-size:14px}
.am-card:has(.am-send) .am-top{flex-wrap:wrap}
.am-card:has(.am-send) .am-act{width:100%;justify-content:stretch}
.am-paid{margin-top:8px;padding:7px 10px;border-radius:9px;background:#fff4c2;font-size:13.5px}
.am-what{margin-top:8px;font-size:14px;color:var(--ink);line-height:1.45}
.am-meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.am-st{font-family:var(--sans);font-weight:600;color:var(--ink)}
.am-st.ok{color:var(--red)}.am-st.err{color:#a35a00}.am-st.x{color:var(--muted)}
.am-empty{padding:40px 0;text-align:center;color:var(--muted)}
.am-reg{margin:0 16px;padding:18px;display:grid;gap:10px}
.am-uid{font-family:var(--mono);font-size:15px;word-break:break-all}
.am-reg p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.am-chk{display:grid;gap:8px;margin:6px 0 10px}
.am-chk>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 14px;border-radius:12px;background:#f3f6fb}
.am-chk>div.pa{background:#fff4c2}
.am-chk span{font-size:13px;color:var(--muted)}
.am-chk b{font-size:18px;font-weight:700;color:var(--ink);word-break:keep-all;text-align:right}
.am-chk-s{margin:0 0 16px!important;font-size:13.5px!important}
.free-use{margin:2px 0 4px;padding:12px 14px;border-radius:12px;background:#eef5ff}
.free-use em{font-style:normal;font-family:var(--mono);color:var(--red);margin-left:6px}
.cpn{font-size:12px;font-weight:600;color:var(--red);margin-left:6px}
.cpn-card{display:flex;flex-direction:column;gap:3px;width:calc(100% - 32px);margin:10px 16px 0;padding:14px 16px;border:1.5px dashed var(--red);border-radius:14px;background:#f3f8ff;text-align:left}
.cpn-card b{font-size:15px;color:var(--ink)}.cpn-card span{font-size:13px;color:var(--red);font-weight:600}
.am-paid.warn{background:#fde9d2}
/* 주문서: 가명 / 필수 동의 */
.lbl-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.alias{border:0;background:none;padding:6px 2px;min-height:36px;color:var(--red);font-size:13.5px;font-weight:600}
.check.req{border:1.5px solid transparent;border-radius:12px;padding:10px 12px;margin:4px -12px}
.check.req b{color:var(--red);font-weight:700}
.check.req.shake{border-color:var(--red);background:#eef5ff;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#oSubmit[aria-disabled="true"]{opacity:.45;box-shadow:none}
.paid-note{margin-top:8px;padding:9px 12px;border-radius:10px;background:#eef5ff;color:var(--ink);font-size:13px;line-height:1.5}
.trk .act{gap:14px}
.pa-d{margin:6px 0 12px;color:var(--muted);font-size:14.5px;line-height:1.55}
.pa-d.sm{margin:8px 0 18px;font-size:13px;font-family:var(--mono)}
.pa-in{width:100%;height:52px;padding:0 14px;border:1.5px solid #c9d6ea;border-radius:12px;font-size:17px;background:#fff;color:var(--ink)}
.pa-in:focus{outline:none;border-color:var(--red)}
@media (prefers-reduced-motion:reduce){.check.req.shake{animation:none}}
/* 입금 안내: 해야 할 일 3가지를 위에서부터 */
.pay{display:grid;gap:10px;margin:4px 0 2px}
.pay-b{background:#fff;border:1px solid #dbe5f3;border-radius:14px;padding:14px 16px}
.pay-b.key{border:1.5px solid var(--red);background:#f3f8ff}
.pay-t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pay-l{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.pay-amt{display:block;margin-top:2px;font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.pay-v{display:block;margin-top:4px;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ink);word-break:keep-all}
.pay-v.big{font-size:24px;color:var(--red)}
.pay-s{display:block;margin-top:4px;font-size:13px;line-height:1.5;color:var(--muted);word-break:keep-all}
.pay-s b{color:var(--ink);font-weight:600}
.pay .cp{flex:none}
.rc-cap{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--muted)}

/* ===== 차분하게: 본질만 ===== */
.qno{display:none}
.step,.intro{animation:calmIn .28s var(--ease)}
.step.rev{animation-name:calmBack}
@keyframes calmIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes calmBack{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.choices > *,.toggles > *{animation:none}
.progress i{box-shadow:none;transition:width .45s var(--ease)}
.progress i::after{display:none}
.stepper span.c::before{animation:none;box-shadow:0 0 0 4px rgba(45,124,227,.16)}
.ok .bp{display:none}
.ok .disc{filter:none;animation:pop .4s var(--ease) both}
.choice{box-shadow:0 1px 2px rgba(26,31,46,.05),0 2px 8px rgba(26,31,46,.04);background:#fff;transition:transform .2s var(--ease),box-shadow .2s,background .2s,color .2s}
.choice.on{transform:none;box-shadow:0 0 0 2px var(--red);background:#f3f8ff}
.choice.sub2.on{box-shadow:0 0 0 2px var(--red)}
.choice.on .bub{animation:none;box-shadow:none}
.subj,.tg,.list,.panel,.sum,.feat,.trk,.custom-link,.fi{box-shadow:0 1px 2px rgba(26,31,46,.05),0 2px 8px rgba(26,31,46,.04)}
.subj[aria-pressed="true"]{transform:none;box-shadow:none}
.tg.on{transform:none;box-shadow:none}
.btn.primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.item:active .thumb{transform:none}
.done-t,.done-s,.done-n,.done-link{animation-duration:.3s}
.done-t{animation-delay:.3s}.done-s{animation-delay:.35s}.done-link{animation-delay:1.5s}

/* 부정 동작: 빨간색은 최종 확인 버튼 하나에만, 옅게 */
.btn.danger{background:#fbeceb;border:0;color:#c8423a;box-shadow:none}
.trk .act{display:flex;justify-content:flex-end;margin-top:-4px}
.cancel{background:none;border:0;padding:6px 2px;color:var(--muted);font-size:13.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.trk.cx{opacity:.55}
.trk.cx .msg{color:var(--muted)}
/* 확인 시트 */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(20,26,40,.32);display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom));animation:fadeIn .2s ease}
.sheet-bg[hidden]{display:none}
.dlg{width:100%;max-width:456px;border-radius:24px;padding:24px 20px 16px;animation:sheetUp .3s var(--ease)}
.dlg.glass{background:rgba(255,255,255,.9)}
.dlg h2{font-size:20px;font-weight:700;letter-spacing:-.02em;word-break:keep-all}
.dlg p,.dlg .sh-p{margin:8px 0 20px;color:var(--muted);font-size:15px;line-height:1.55}
.dlg .sh-p:has(.inv-list){margin:0;color:var(--ink)}
.sheet-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-btns .btn{height:52px;border-radius:14px}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet-bg,.dlg{animation:none}}

/* 앞에서 고른 답 */
.ctx{display:flex;flex-wrap:wrap;gap:6px;padding:14px 20px 0}
.ctxc{height:30px;padding:0 12px;border-radius:15px;border:0;background:#fff;box-shadow:0 1px 2px rgba(26,31,46,.06);font-size:13px;font-weight:600;color:var(--ink)}
.ctxc:active{background:var(--soft)}
.ctx + .step .ask{margin-top:14px}

.sug .manual span{color:var(--muted);font-weight:500;font-size:15px}
.sug .manual small{color:var(--red);font-weight:600}
.choice{height:auto;min-height:60px;padding-top:12px;padding-bottom:12px;line-height:1.4}
.choices.grid .choice{min-height:56px}
/* ===== THEFACTORIAL: 검정 페이지 ===== */
body,.shell{transition:background-color .45s ease}
body.tf{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--muted:#98989d;--line:#2c2c2e;--soft:#2c2c2e;--frame:#000;background:#000}
body.tf .shell{background:#000}
body.tf .glass{background:linear-gradient(180deg,rgba(44,44,48,.62),rgba(28,28,30,.5));box-shadow:inset 0 1px 1px rgba(255,255,255,.14),inset 0 -1px 1px rgba(255,255,255,.05),0 14px 34px rgba(0,0,0,.5)}
body.tf .glass::before{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 50%)}
body.tf .glass::after{background:linear-gradient(140deg,rgba(255,255,255,.35),rgba(255,255,255,.04) 40%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.2))}
body.tf .top{box-shadow:inset 0 -1px 0 rgba(255,255,255,.06)}
body.tf .mark{background:#f5f5f7;color:#000}
body.tf .mark b{color:#2d7ce3}
body.tf .nav button{color:#98989d}
body.tf .nav button[aria-current="page"]{color:#fff}
body.tf .nav .lens{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.4)}

.tf-page{animation:calmIn .5s var(--ease)}
.tf-hero{text-align:center;padding:52px 24px 0}
.tf-eyebrow{margin:0;font-size:15px;font-weight:600;color:#98989d}
.tf-word{margin:6px 0 0;font-family:var(--sans);font-size:clamp(38px,11.5vw,54px);font-weight:800;letter-spacing:-.02em;line-height:1.05;background:linear-gradient(180deg,#fff 35%,#8e8e93);-webkit-background-clip:text;background-clip:text;color:transparent}
.tf-tag{margin:14px 0 0;font-size:22px;font-weight:600;color:#f5f5f7;letter-spacing:-.02em}
.tf-price{margin:6px 0 0;font-size:15px;color:#98989d}
.tf-cta{margin-top:22px;height:46px;padding:0 26px;border:0;border-radius:23px;background:#2d7ce3;color:#fff;font-size:17px;font-weight:600;transition:transform .2s var(--ease),background .2s}
.tf-cta:active{transform:scale(.96);background:#2468c9}
.tf-fan{height:170px;margin:46px 0 0;filter:drop-shadow(0 30px 50px rgba(45,124,227,.35))}
.tf-fan .thumb{width:96px;box-shadow:none;--ink:#1a1f2e;--muted:#647089;color:#1a1f2e}
.tf-feats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:46px 16px 0}
.tf-feat{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:168px;padding:20px 18px;border-radius:22px;background:#1c1c1e;text-align:left}
.tf-feat .k{font-size:12.5px;font-weight:700;color:#5aa2ff}
.tf-feat b{font-size:19px;line-height:1.3;letter-spacing:-.02em;color:#f5f5f7}
.tf-feat > span:last-child{font-size:13px;line-height:1.5;color:#98989d}
.tf-sec{text-align:center;padding:52px 24px 0}
.tf-sec h2{font-size:28px;font-weight:700;letter-spacing:-.03em;color:#f5f5f7}
.tf-plans{display:grid;gap:10px;padding:20px 16px 0}
.tf-plan{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:22px 20px;border:0;border-radius:22px;background:#1c1c1e;color:#f5f5f7;text-align:left;transition:transform .2s var(--ease)}
.tf-plan:active{transform:scale(.98)}
.tf-plan b{display:block;font-size:20px;letter-spacing:-.02em}
.tf-plan b em{font-style:normal;font-size:12px;font-weight:700;color:#5aa2ff;margin-left:6px;vertical-align:3px}
.tf-plan span{font-size:13.5px;color:#98989d}
.tf-plan .p{font-size:19px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tf-plan .p small{display:block;font-size:12px;font-weight:500;color:#98989d}
.tf-plan.rec{box-shadow:inset 0 0 0 1.5px #2d7ce3}
.tf-fine{margin:0;padding:22px 24px 0;text-align:center;font-size:13px;line-height:1.7;color:#86868b}

/* 신청 흐름: 어두운 화면 */
body.tf .back-ic{color:#f5f5f7}
body.tf .back-ic:active{background:#1c1c1e}
body.tf .progress{background:#2c2c2e;box-shadow:none}
body.tf .ctxc{background:#1c1c1e;color:#f5f5f7;box-shadow:none}
body.tf .choice{background:#1c1c1e;color:#f5f5f7;box-shadow:none}
body.tf .choice.on{background:#10233f;box-shadow:0 0 0 2px #2d7ce3}
body.tf .choice.on .ct{color:#7ab3ff}
body.tf .choice.sub2{background:transparent;box-shadow:inset 0 0 0 1.5px #3a3a3c}
body.tf .choice.sub2.on{box-shadow:0 0 0 2px #2d7ce3}
body.tf .bub{background:#2c2c2e;color:#98989d;box-shadow:inset 0 0 0 1.5px #48484a}
body.tf .big-input{color:#f5f5f7;border-bottom-color:#3a3a3c}
body.tf .big-input::placeholder{color:#636366}
body.tf .sug button{border-bottom-color:#2c2c2e;color:#f5f5f7}
body.tf .sug button:active{background:#1c1c1e}
body.tf .tg{background:#1c1c1e;color:#f5f5f7;box-shadow:none}
body.tf .tg.on{background:#2d7ce3;color:#fff}
body.tf .drop{background:#1c1c1e;border-color:#48484a}
body.tf .fi{background:#1c1c1e;box-shadow:none}
body.tf .rv{border-bottom-color:#2c2c2e}
.rv.tot{border-bottom:0;font-weight:700}
.rv.tot .v{font-size:19px;color:var(--red)}
body.tf .rv.tot .v{color:#7ab3ff}
body.tf .btn.primary:disabled,body.tf .cta .btn:disabled{background:#2c2c2e;color:#636366}
body.tf .done-link{color:#7ab3ff}
body.tf .rcpt{--ink:#1a1f2e;--muted:#647089;color:#1a1f2e}
body.tf .dlg.glass{background:rgba(28,28,30,.92)}

/* 홈의 THEFACTORIAL 카드 */
.tf-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:calc(100% - 32px);margin:16px 16px 0;padding:22px 20px;border:0;border-radius:20px;background:#000;color:#f5f5f7;text-align:left;transition:transform .2s var(--ease)}
.tf-card:active{transform:scale(.98)}
.tf-card .w{font-family:var(--sans);font-size:22px;font-weight:800;letter-spacing:-.01em;background:linear-gradient(180deg,#fff 35%,#8e8e93);-webkit-background-clip:text;background-clip:text;color:transparent}
.tf-card b{font-size:16px;font-weight:600}
.tf-card .s{font-size:13px;color:#98989d}
.includes.bundle{margin-top:10px}
.includes.bundle .inc{align-items:center;border-top:0}
/* THEFACTORIAL 설득 섹션 */
.tf-state{padding:64px 24px 0;text-align:center}
.tf-state p{margin:0;font-size:22px;font-weight:600;line-height:1.45;letter-spacing:-.02em;color:#86868b}
.tf-state p.hi{margin-top:14px;font-size:28px;font-weight:700;color:#f5f5f7}
.tf-cmp{margin:20px 16px 0;padding:6px 18px;border-radius:22px;background:#1c1c1e}
.tf-cmp .r{display:grid;grid-template-columns:1fr 64px 92px;gap:8px;align-items:center;padding:14px 0;border-bottom:1px solid #2c2c2e;font-size:14.5px;color:#f5f5f7}
.tf-cmp .r:last-child{border-bottom:0}
.tf-cmp .r.h{font-size:12px;font-weight:600;color:#86868b;padding:12px 0 10px}
.tf-cmp .r.h span:last-child{color:#5aa2ff}
.tf-cmp .r > span:nth-child(2),.tf-cmp .r > span:nth-child(3){text-align:center;display:flex;justify-content:center}
.tf-cmp .x{color:#48484a}
.tf-cmp .o{color:#5aa2ff}
.tf-list{list-style:none;margin:20px 16px 0;padding:6px 18px;border-radius:22px;background:#1c1c1e}
.tf-list li{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid #2c2c2e}
.tf-list li:last-child{border-bottom:0}
.tf-list svg{color:#5aa2ff;margin-top:2px}
.tf-list b{display:block;font-size:16px;color:#f5f5f7}
.tf-list span{font-size:13.5px;color:#98989d}
.tf-price-sec{padding:64px 24px 0;text-align:center}
.tf-price-sec .s{margin:0;font-size:15px;line-height:1.6;color:#98989d}
.tf-price-sec .big{margin:6px 0 12px;font-family:var(--sans);font-size:clamp(44px,13vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1.05;background:linear-gradient(180deg,#7ab3ff,#2d7ce3);-webkit-background-clip:text;background-clip:text;color:transparent}
.tf-steps{list-style:none;margin:20px 16px 0;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:2px}
.tf-steps li{counter-increment:st;display:grid;grid-template-columns:30px 1fr;column-gap:12px;padding:12px 4px}
.tf-steps li::before{content:counter(st);grid-row:span 2;width:26px;height:26px;border-radius:13px;background:#1c1c1e;color:#5aa2ff;font-size:13px;font-weight:700;display:grid;place-items:center}
.tf-steps b{font-size:16px;color:#f5f5f7}
.tf-steps span{font-size:13.5px;color:#98989d}
.tf-promise{margin:40px 16px 0;padding:20px;border-radius:22px;background:linear-gradient(180deg,#14243c,#0e1828);text-align:center}
.tf-promise b{display:block;font-size:17px;color:#f5f5f7}
.tf-promise span{font-size:14px;color:#98b8e0}
/* ===== THEFACTORIAL v2: 애플식 판매 페이지 ===== */
body.tf{--muted:#a1a1a6}
.tf-page{padding-bottom:20px}
.tf-local{position:sticky;top:62px;z-index:15;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px 0 20px;border-radius:0}
.tf-local span{font-family:var(--sans);font-size:17px;font-weight:700;letter-spacing:-.01em;color:#f5f5f7}
.tf-pill{height:30px;padding:0 14px;border:0;border-radius:15px;background:#2d7ce3;color:#fff;font-size:13.5px;font-weight:600}
.tf-pill:active{background:#2468c9}
.tf-hero{padding:44px 24px 0}
.tf-word{font-size:clamp(40px,12vw,56px)}
.tf-head{margin:12px 0 0;font-size:26px;font-weight:700;line-height:1.3;letter-spacing:-.03em;color:#f5f5f7}
.tf-from{margin:12px 0 0;font-size:17px;color:#a1a1a6}
.tf-links{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:22px}
.tf-cta{margin-top:0;height:48px;padding:0 28px;border-radius:24px;font-size:17px}
.tf-more{background:none;border:0;padding:8px 0;color:#5aa2ff;font-size:17px;font-weight:500}
.tf-fan{margin-top:52px}
.tf-block{padding:96px 24px 0;text-align:center}
.tf-h2{margin:0;font-size:32px;font-weight:700;line-height:1.25;letter-spacing:-.035em;color:#f5f5f7}
.tf-h2 span{color:#86868b}
.tf-p{margin:18px auto 0;max-width:30ch;font-size:17px;line-height:1.6;color:#a1a1a6;word-break:keep-all}
.tf-stats{display:flex;flex-direction:column;gap:40px;padding:72px 24px 0;text-align:center}
.tf-stats b{display:block;font-family:var(--sans);font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(180deg,#9cc6ff,#2d7ce3);-webkit-background-clip:text;background-clip:text;color:transparent}
.tf-stats span{display:block;margin-top:10px;font-size:17px;line-height:1.5;color:#a1a1a6}
.tf-feats{padding:56px 16px 0;gap:12px}
.tf-feat{min-height:190px;padding:22px 20px;gap:8px}
.tf-feat .k{font-size:13px}
.tf-feat b{font-size:21px}
.tf-feat .d{font-size:14.5px;line-height:1.5;color:#a1a1a6}
.tf-compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:36px 16px 0}
.tf-compare .col{position:relative;display:flex;flex-direction:column;align-items:center;padding:26px 14px 10px;border-radius:22px;background:#1c1c1e;text-align:center}
.tf-compare .col.rec{box-shadow:inset 0 0 0 1.5px #2d7ce3}
.tf-compare .tag{position:absolute;top:10px;left:0;right:0;margin:0;font-size:12px;font-weight:700;color:#5aa2ff}
.tf-compare .nm{margin:6px 0 0;font-size:24px;font-weight:700;letter-spacing:-.02em;color:#f5f5f7}
.tf-compare .pr{margin:4px 0 0;font-size:17px;font-weight:600;color:#f5f5f7;font-variant-numeric:tabular-nums}
.tf-compare .per{margin:2px 0 0;font-size:13px;color:#a1a1a6}
.tf-buy{margin:16px 0 10px;height:38px;padding:0 18px;border:0;border-radius:19px;background:#2d7ce3;color:#fff;font-size:15px;font-weight:600}
.tf-buy:active{background:#2468c9}
.tf-compare ul{list-style:none;margin:6px 0 0;padding:0;width:100%}
.tf-compare li{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 0;border-top:1px solid #2c2c2e}
.tf-compare li b{font-size:17px;color:#f5f5f7}
.tf-compare li svg{color:#5aa2ff}
.tf-compare li .dash{font-size:17px;color:#48484a;line-height:20px}
.tf-compare li span{font-size:13.5px;line-height:1.4;color:#a1a1a6;word-break:keep-all}
.tf-steps{margin:36px 16px 0;gap:6px}
.tf-steps li{padding:14px 4px;grid-template-columns:34px 1fr}
.tf-steps li::before{width:30px;height:30px;border-radius:15px;font-size:14px}
.tf-steps b{font-size:18px}
.tf-steps span{font-size:15px;color:#a1a1a6}
.tf-end{padding:56px 24px 0;text-align:center}
.tf-notes{margin:48px 24px 0;padding:24px 0 0 18px;border-top:1px solid #2c2c2e;font-size:12.5px;line-height:1.7;color:#86868b}
.tf-habit{margin:40px 16px 0;padding:24px 20px 8px;border-radius:22px;background:#1c1c1e}
.tf-habit .cap{margin:0 0 6px;font-size:13px;font-weight:700;color:#5aa2ff}
.tf-habit ul{list-style:none;margin:0;padding:0}
.tf-habit li{padding:16px 0;border-top:1px solid #2c2c2e}
.tf-habit li:first-child{border-top:0}
.tf-habit b{display:block;font-size:18px;letter-spacing:-.02em;color:#f5f5f7}
.tf-habit span{display:block;margin-top:2px;font-size:15px;color:#a1a1a6}
.tf-h2{font-size:28px;line-height:1.35}
.tf-when{list-style:none;margin:28px 16px 0;padding:6px 20px;border-radius:22px;background:#1c1c1e}
.tf-when li{position:relative;padding:16px 0 16px 26px;border-top:1px solid #2c2c2e;font-size:16.5px;line-height:1.5;color:#f5f5f7;word-break:keep-all}
.tf-when li:first-child{border-top:0}
.tf-when li::before{content:"";position:absolute;left:2px;top:24px;width:8px;height:8px;border-radius:50%;background:#2d7ce3}
.tf-stats span{font-size:16px}
/* 내 정보 */
.nav button{font-size:11px}
.acc-out{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 24px 0}
.acc-ico{width:72px;height:72px;border-radius:36px;background:#fff;display:grid;place-items:center;color:var(--red);box-shadow:0 1px 2px rgba(26,31,46,.05),0 2px 8px rgba(26,31,46,.04)}
.acc-out h1{margin-top:22px;font-size:23px;font-weight:700;letter-spacing:-.02em}
.acc-out p{margin:8px 0 0;color:var(--muted);font-size:15px;line-height:1.6}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:340px;height:52px;margin-top:28px;border:0;border-radius:14px;background:#fff;font-size:16px;font-weight:600;box-shadow:0 1px 2px rgba(26,31,46,.08),0 2px 8px rgba(26,31,46,.06)}
.btn-google:active{transform:scale(.98)}
.btn-kakao{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:340px;height:52px;margin-top:12px;border:0;border-radius:14px;background:#FEE500;color:#191919;font-size:16px;font-weight:600}
.btn-kakao:active{transform:scale(.98)}
.btn-x{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:340px;height:52px;margin-top:12px;border:0;border-radius:14px;background:#111;color:#fff;font-size:16px;font-weight:600}
.btn-x:active{transform:scale(.98)}
.acc-out .acc-fine{font-size:13px;margin-top:12px}
.acc-head{display:flex;align-items:center;gap:14px;padding:24px 18px 6px}
.acc-head .av{width:54px;height:54px;border-radius:27px;background:var(--grad);color:#fff;font-size:22px;font-weight:700;display:grid;place-items:center}
.acc-head b{display:block;font-size:19px;letter-spacing:-.02em}
.acc-head span{font-size:14px;color:var(--muted)}
.acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 0}
.acc-tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px 18px;border:0;border-radius:18px;background:#fff;text-align:left;box-shadow:0 1px 2px rgba(26,31,46,.05),0 2px 8px rgba(26,31,46,.04)}
.acc-tile span{font-size:13.5px;color:var(--muted)}
.acc-tile b{font-size:22px;font-variant-numeric:tabular-nums}
button.acc-tile:active{transform:scale(.97)}
.acc-card{margin:0 16px;padding:16px 18px;border-radius:20px;background:#fff;box-shadow:0 1px 2px rgba(26,31,46,.05),0 2px 8px rgba(26,31,46,.04)}
.invite .lead{margin:0 0 8px;font-size:15px;font-weight:600}
.invite ul{list-style:none;margin:0;padding:0}
.invite li{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:8px 0;font-size:14.5px;border-top:1px solid var(--line)}
.invite li:first-child{border-top:0}
.invite li b{color:var(--red)}
.invite li span{color:var(--ink)}
.invite .link{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--soft)}
.invite .link span{text-decoration:none;font-size:13.5px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.invite .meter{height:6px;margin-top:16px;border-radius:3px;background:var(--soft);overflow:hidden}
.invite .meter i{display:block;height:100%;background:var(--grad);border-radius:3px}
.invite .cnt{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.menu{padding:4px 18px}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:15px 0;border:0;border-top:1px solid var(--line);background:none;font-size:15.5px;text-align:left}
.menu button:first-child{border-top:0}
.menu .v{font-size:13.5px;color:var(--muted)}
.menu .muted{color:var(--muted);font-size:14px}
.tgl{position:relative;width:46px;height:28px;border-radius:14px;background:#d6dbe4;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.tgl.on{background:var(--red)}
.tgl.on::after{transform:translateX(18px)}
/* 완료 표시: 파란 펜 손글씨 (최종) */
.ok.pen svg{width:112px;height:112px;overflow:visible;display:block}
.ok.pen path{fill:none;stroke:var(--red);stroke-linecap:round;stroke-linejoin:round;filter:none}
.ok.pen .circ{stroke-width:4.2;stroke-dasharray:320;stroke-dashoffset:320;animation:draw .7s cubic-bezier(.55,.05,.35,1) .15s forwards}
.ok.pen .tick{stroke-width:5;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .38s cubic-bezier(.55,.05,.35,1) .85s forwards}
.ok.pen .ghost{opacity:.28;stroke-width:2.4}
body.tf .ok.pen path{stroke:#5aa2ff}
@media (prefers-reduced-motion:reduce){.ok.pen .circ,.ok.pen .tick{animation:none;stroke-dashoffset:0}}
/* 시험 일정 카드 + 기한 선택지 */
.exam-card{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-8px 0 16px;padding:14px 18px;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(26,31,46,.05),0 2px 8px rgba(26,31,46,.04)}
.exam-card .k{display:block;font-size:13px;color:var(--muted)}
.exam-card b{display:block;margin-top:2px;font-size:17px}
.exam-card .dd{font-size:22px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.exam-card.wait{font-size:14px;color:var(--muted)}
.choice.due{min-height:68px}
.choice .ct small{display:block;margin-top:2px;font-size:13px;font-weight:500;color:var(--muted)}
.choice.on .ct small{color:var(--red);opacity:.8}
.rec-tag{font-style:normal;margin-left:8px;padding:2px 8px;border-radius:10px;background:#e6eefa;color:var(--red);font-size:11.5px;font-weight:700;vertical-align:2px}
.step.still{animation:none}
body.tf .exam-card{background:#1c1c1e;box-shadow:none}
body.tf .exam-card .dd{color:#7ab3ff}
body.tf .rec-tag{background:#10233f;color:#7ab3ff}
body.tf .choice.on .ct small{color:#7ab3ff}
/* THEFACTORIAL 글자: 로고 PNG와 같은 글꼴(IBM Plex Sans KR 굵게)로 통일 */
.tf-word,.tf-card .w,.tf-local span{font-weight:700;letter-spacing:-.02em}

/* Responsive layout and interaction polish */
:root{--content-width:1040px}
html{scroll-padding-top:88px}
body{overflow-wrap:break-word}
.shell{max-width:var(--content-width);min-height:100dvh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
#app{min-width:0}
.top{padding-top:calc(10px + env(safe-area-inset-top));gap:12px}
.logo{min-width:0}.logo>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catalog-intro{padding:26px 18px 0}
.catalog-intro .eyebrow{margin:0 0 5px;color:var(--red);font-size:12px;font-weight:600;letter-spacing:.04em}
.catalog-intro h1{margin:0;font-size:25px;line-height:1.35;letter-spacing:-.035em}
.catalog-intro p{margin:8px 0 0;color:var(--muted);font-size:14px}
.catalog-search{display:flex;align-items:center;gap:10px;margin:20px 16px 0;padding:0 12px 0 14px;min-height:50px;border:1px solid #cbd6e5;border-radius:14px;background:var(--card)}
.catalog-search:focus-within{border-color:var(--red);box-shadow:0 0 0 3px rgba(45,124,227,.12)}
.catalog-search svg{flex:none;color:var(--muted)}
.catalog-search input{width:100%;min-width:0;padding:13px 0;border:0;outline:none;background:none;font-size:16px}
.search-clear{flex:none;width:40px;height:40px;border:0;border-radius:10px;background:var(--soft);font-size:20px;color:var(--muted)}
.search-clear[hidden]{display:none}
.subjects{gap:8px;padding-top:14px}
.subj{padding:12px;min-height:68px;box-shadow:none;border:1px solid rgba(100,112,137,.12)}
.subj .n{font-size:14px}.subj .k{margin-top:3px}
.list-head{padding-top:18px;gap:8px;flex-wrap:wrap}.list-head h2{font-size:18px;line-height:1.4}
.item{min-width:0;padding:16px;gap:14px}.item .info{min-width:0}.item .title{line-height:1.5;word-break:keep-all}
.item .sub{line-height:1.6}.item .prices{margin-top:5px}
.item .new{font-size:10px;vertical-align:middle}
.empty{padding:38px 20px;text-align:center}.empty p{margin:0 0 16px;color:var(--muted)}
.btn.sm,.cp{min-height:40px}.link,.cancel{min-height:44px;display:inline-flex;align-items:center}
.invite .link{display:flex;text-decoration:none}.invite .link .btn{flex:none}
.btn,.choice,.subj,.item,.acc-tile,.tf-plan{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:disabled{cursor:not-allowed}.btn.primary:disabled{color:#425e86}
.field input,.field select,.field textarea{font-size:16px;scroll-margin-block:100px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
.field .err:empty{display:none}
.check{padding:8px 0;align-items:center;cursor:pointer}.check input{flex:none}
.backlink{min-height:48px;padding:12px 16px;gap:6px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr)}
.detail-grid>.d-head{grid-row:1;padding:16px 18px 14px;border:0;background:transparent}
.detail-grid>.preview-wrap{grid-row:2;padding-top:0}
.detail-grid .sheet{max-width:400px;margin:0 auto;box-shadow:0 8px 24px rgba(26,31,46,.07)}
.detail-grid>.spec,.detail-grid>.includes{margin:0 16px 12px;border:1px solid var(--line);border-radius:16px}
.detail-grid>.spec{padding:18px;grid-template-columns:64px minmax(0,1fr);line-height:1.65}
.detail-grid>.includes{padding:16px 18px}
.inc{align-items:center;flex-wrap:wrap}
.tf-word{font-size:clamp(26px,8.4vw,46px);white-space:nowrap;overflow-wrap:normal}
.acc-out{padding:36px 24px 30px}
.acc-out h1{font-size:24px}.acc-out .acc-ico{width:64px;height:64px}
.login-options{width:100%;max-width:360px;display:grid;gap:12px;margin-top:26px}
.login-options button{max-width:none;margin:0;min-height:52px}
.login-options button:disabled{cursor:wait;opacity:.65}
.login-status{min-height:22px;font-size:13px;color:var(--muted);text-align:center}
.acc-out .acc-fine{margin-top:0}
.acc-head>div:last-child{min-width:0}.acc-head span{display:block;overflow-wrap:anywhere}
.menu button{min-height:54px}.menu .v{overflow-wrap:anywhere;text-align:right}.tgl{flex:none}
.nav{width:calc(100% - 24px);max-width:480px;background:rgba(255,255,255,.96)}
.nav button{min-height:56px;font-size:12px;gap:3px}
.buybar{max-width:560px}.buybar .btn{font-size:14px;min-width:0;height:auto;min-height:50px;padding:10px 12px;line-height:1.4}
.cta{max-width:600px}.step{padding-bottom:32px}.done{padding-bottom:40px}
.foot{line-height:1.85;overflow-wrap:anywhere}
.sheet-bg{overflow-y:auto;overscroll-behavior:contain}
.dlg{max-height:calc(100dvh - 32px);overflow-y:auto}
body.tf{color-scheme:dark}
body.tf .btn.primary:disabled{color:#98989d}
body.tf .nav{background:rgba(28,28,30,.96)}
@media(min-width:700px){
  body{background:#e1e8f2}
  .top{padding-left:28px;padding-right:24px}
  #app{max-width:680px;margin:0 auto;padding:10px 12px 0}
  #app[data-view="home"],#app[data-view="detail"]{max-width:none;padding:12px 24px 0}
  .catalog-intro{padding-top:24px}.catalog-intro h1{font-size:30px}
  .subjects{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
  .subj{min-height:76px}
  .catalog-results .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
  .catalog-results .item{border:0;background:var(--card);min-height:128px}
  .catalog-results .empty{grid-column:1/-1;background:var(--card)}
  .tf-card{padding:28px}.tf-card .w{font-size:26px}
  .detail-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px;align-items:start}
  .detail-grid>.preview-wrap{grid-column:1;grid-row:1 / span 5;padding:16px}
  .detail-grid>.d-head{grid-column:2;grid-row:1}
  .detail-grid>.spec,.detail-grid>.includes{grid-column:2}
  .detail-grid>.spec{grid-row:2}.detail-grid>.includes{grid-row:3}.detail-grid>.includes.bundle{grid-row:4}
  .detail-grid .sheet{font-size:11px}
  .acc-out{padding-top:48px}
  .sheet-bg{align-items:center}
}
@media(hover:hover){
  .item:hover{background:#f5f8fd}.subj:not([aria-pressed="true"]):hover{background:#f4f8ff;border-color:#b1c9e9}
  .btn:not(:disabled):hover{filter:brightness(.97)}.menu button:hover{color:var(--red)}
}
@media(max-width:359px){
  .catalog-intro h1{font-size:23px}.subj{padding:10px 8px}.subj .n{font-size:12px}
  .item{grid-template-columns:46px minmax(0,1fr) 12px;gap:10px;padding:14px 12px}.item .thumb{width:46px}
  .item .title{font-size:15px}.item .sub,.item .prices{font-size:12px}
  .nav{width:calc(100% - 16px)}.buybar .btn{font-size:12.5px;padding:10px 8px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ===== 태블릿·PC 최적화 ===== */
.top-links{display:none}
@media(min-width:700px){
  /* THEFACTORIAL 소개: 넓은 화면에서 읽기 좋은 폭으로 */

  .shell{padding-bottom:48px}
  .toast{bottom:32px}
  body.tf .top-links button{color:#98989d}
  body.tf .top-links button:hover{color:#f5f5f7;background:rgba(255,255,255,.08)}
  body.tf .top-links button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.12)}
  /* 모의고사 목록 3열 */
  .catalog-results .list{grid-template-columns:repeat(3,minmax(0,1fr))}
  .catalog-intro h1{font-size:34px}
  /* THEFACTORIAL */
  .tf-word{font-size:88px}
  .tf-head{font-size:34px}
  .tf-h2{font-size:42px}
  .tf-feats{max-width:1000px;grid-template-columns:repeat(4,minmax(0,1fr))}
  .tf-feat{min-height:220px}
  .tf-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;max-width:1000px}
  .tf-steps li{grid-template-columns:1fr;row-gap:8px;padding:20px 16px;border-radius:20px;background:#1c1c1e}
  .tf-steps li::before{grid-row:auto}

/* ===== THEFACTORIAL: 유광 리퀴드 글래스, 계속 흐르는 배경 ===== */
.liquid{position:absolute;inset:0;display:block;overflow:hidden;border-radius:inherit;pointer-events:none;z-index:0}
.liquid.fixed{position:fixed;inset:0;border-radius:0;opacity:.7}
.liquid i{position:absolute;display:block;width:70%;aspect-ratio:1;border-radius:50%;filter:blur(48px);mix-blend-mode:screen;will-change:transform}
.liquid i:nth-child(1){left:-15%;top:-35%;background:radial-gradient(circle at 40% 40%,rgba(45,124,227,.95),rgba(45,124,227,0) 62%);animation:flowA 17s ease-in-out infinite alternate}
.liquid i:nth-child(2){right:-20%;top:-10%;background:radial-gradient(circle at 50% 50%,rgba(56,189,248,.7),rgba(56,189,248,0) 60%);animation:flowB 21s ease-in-out infinite alternate}
.liquid i:nth-child(3){left:20%;bottom:-55%;background:radial-gradient(circle at 50% 50%,rgba(129,140,248,.6),rgba(129,140,248,0) 60%);animation:flowC 25s ease-in-out infinite alternate}
.liquid.fixed i{width:min(90vw,900px)}
@keyframes flowA{0%{transform:translate(0,0) scale(1) rotate(0)}50%{transform:translate(18%,22%) scale(1.15) rotate(40deg)}100%{transform:translate(38%,6%) scale(.95) rotate(90deg)}}
@keyframes flowB{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-26%,30%) scale(1.2)}100%{transform:translate(-8%,52%) scale(.9)}}
@keyframes flowC{0%{transform:translate(0,0) scale(1.1)}50%{transform:translate(24%,-30%) scale(.9)}100%{transform:translate(-20%,-18%) scale(1.15)}}

/* liquid glass 굴절: 유리 가장자리에서 뒤 화면이 휘어 보이게 (크롬 계열만 지원. 다른 브라우저는 기본 유리) */
const LG_OK = (() => { try {
  const ua = navigator.userAgent;
  const cr = !!window.chrome || !!(navigator.userAgentData && navigator.userAgentData.brands.some(b => b.brand === 'Chromium'));
  return cr && !/iPhone|iPad|iPod|CriOS|FxiOS|EdgiOS/.test(ua) && CSS.supports('backdrop-filter', 'blur(1px)');
} catch(_) { return false; } })();
function lgApply(el, id, edge, scale, tail){
  if (!LG_OK || !el || el.hidden) return;
  const w = Math.round(el.offsetWidth), h = Math.round(el.offsetHeight);
  if (!w || !h) return;
  if (el._lg === w + 'x' + h) return; el._lg = w + 'x' + h;
  const ex = Math.min(.5, edge / w).toFixed(4), ey = Math.min(.5, edge / h).toFixed(4);
  const map = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><defs>`
    + `<linearGradient id="x" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#f00"/><stop offset="${ex}" stop-color="#800000"/><stop offset="${1 - ex}" stop-color="#800000"/><stop offset="1" stop-color="#000"/></linearGradient>`
    + `<linearGradient id="y" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0f0"/><stop offset="${ey}" stop-color="#008000"/><stop offset="${1 - ey}" stop-color="#008000"/><stop offset="1" stop-color="#000"/></linearGradient>`
    + `</defs><rect width="${w}" height="${h}" fill="url(#x)"/><rect width="${w}" height="${h}" fill="url(#y)" style="mix-blend-mode:screen"/></svg>`;
  let defs = document.getElementById('lgDefs');
  if (!defs) {
    defs = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    defs.id = 'lgDefs'; defs.setAttribute('aria-hidden', 'true'); defs.setAttribute('width', '0'); defs.setAttribute('height', '0');
    defs.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
    document.body.appendChild(defs);
  }
  const old = document.getElementById(id); if (old) old.remove();
  defs.insertAdjacentHTML('beforeend', `<filter id="${id}" x="0" y="0" width="${w}" height="${h}" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">`
    + `<feImage href="data:image/svg+xml,${encodeURIComponent(map)}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="m"/>`
    + `<feDisplacementMap in="SourceGraphic" in2="m" scale="${scale}" xChannelSelector="R" yChannelSelector="G"/></filter>`);
  el.style.backdropFilter = `url(#${id}) ${tail}`;
}
function lgRefresh(){
  lgApply(document.getElementById('nav'), 'lgNav', 22, 44, 'blur(7px) saturate(200%) brightness(1.06)');

try { const c = JSON.parse(localStorage.getItem('fx-dday') || 'null'); if (c && c.d && Date.now() - c.t < 12 * 36e5 && c.d >= new Date().setHours(0,0,0,0)) homeExam = c; } catch(_) {}
function ddayHTML(){

async function loadHomeExam(){

  const run = async (fn, ping, done) => {
    adm.busy[id] = true; render();
    try { await fn(); if (ping) notifySheet(ping, id); if (done) toast(done); }
    catch (err) { toast('실패했어요: ' + (err.code || err.message)); }

  };

    openSheet('이 주문을 취소할까요?', `${o.no} · ${o.depositor || o.title} · ${won(o.total || 0)}`, '취소할게요', () => run(() => ref.update({cancelled:true, cancelledAt: firebase.firestore.FieldValue.serverTimestamp()}), 'cancel', '취소했어요.'));
    document.getElementById('shOk').className = 'btn danger';
    return;
  }
  if (a === 'confirm' || a === 'paid') {
    const name = o.depositor || o.no;
    const info = `<div class="am-chk"><div><span>입금자명</span><b>${esc(name)}</b></div><div><span>금액</span><b>${won(o.total || 0)}</b></div>${o.paidAs ? `<div class="pa"><span>학생이 알린 보낸 이름</span><b>${esc(o.paidAs)}</b></div>` : ''}</div>

    openSheet(`입금자가 '${name}'와 일치하신가요?`, '', '네, 일치해요', null, {cls:'btn primary', close:'아니요', html: info});
    sheetFn = () => a === 'confirm' ? run(() => ref.update({stage:1, sendError:''}), 'confirm', '입금 확인. PDF를 보내고 있어요.') : run(() => ref.update({stage:2}), 'stage', '입금 확인했어요.');
    return;
  }
  if (a === 'resend') return run(() => ref.update({sendError:''}), 'confirm', '다시 보내고 있어요.');
  if (a === 'notice') return run(() => ref.update({stage:1}), 'notice', '입금 안내 메일을 보내고 있어요.');
  if (a === 'make') return run(() => ref.update({stage:3}), 'stage', '제작 중으로 바꿨어요.');
  if (a === 'send') {
    const link = (document.getElementById('lk-' + id) || {}).value || '';
    if (!/drive\.google\.com|docs\.google\.com/.test(link)) { toast('구글 드라이브 링크를 넣어 주세요.'); return; }
    return run(() => ref.update({sendLink: link.trim(), sendError:''}), 'send', 'PDF를 보내고 있어요.');
  }
}

const REGION = {'서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천','광주광역시':'광주','대전광역시':'대전','울산광역시':'울산','세종특별자치시':'세종','경기도':'경기','강원특별자치도':'강원','강원도':'강원','충청북도':'충북','충청남도':'충남','전북특별자치도':'전북','전라북도':'전북','전라남도':'전남','경상북도':'경북','경상남도':'경남','제주특별자치도':'제주'};
const schoolCache = new Map();
let schoolSeq = 0;
async function searchSchools(q){
  q = q.trim();
  if (!q || /^[ㄱ-ㅎㅏ-ㅣ\s]+$/.test(q)) return findSchools(q).map(([n, r]) => ({name:n, region:r}));
  if (schoolCache.has(q)) return schoolCache.get(q);
  const url = 'https://open.neis.go.kr/hub/schoolInfo?Type=json&pIndex=1&pSize=' + (NEIS_KEY ? 100 : 5)
    + (NEIS_KEY ? '&KEY=' + NEIS_KEY : '') + '&SCHUL_KND_SC_NM=' + encodeURIComponent('고등학교') + '&SCHUL_NM=' + encodeURIComponent(q);
  try {
    const j = await fetch(url).then(r => r.json());
    const rows = (j.schoolInfo && j.schoolInfo[1] && j.schoolInfo[1].row) || [];
    const list = rows.map(x => {
      const parts = (x.ORG_RDNMA || '').split(' ');
      return {name:x.SCHUL_NM, region:[REGION[parts[0]] || parts[0], parts[1] || ''].join(' ').trim(), code:x.SD_SCHUL_CODE, office:x.ATPT_OFCDC_SC_CODE};
    }).sort((a, b) => (b.name.startsWith(q) - a.name.startsWith(q)) || a.name.length - b.name.length).slice(0, 6);
    schoolCache.set(q, list);
    return list;
  } catch(e) {
    return findSchools(q).map(([n, r]) => ({name:n, region:r}));
  }
}
